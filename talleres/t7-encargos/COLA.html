<title>Una cosa a la vez</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#F5F5F2; --panel:#FFFFFF; --ink:#141614; --ink-2:#4E534D;
  --grey:#7F847C; --line:#DFE0DA; --line-2:#EAEBE5;
  --acc:#3B4A12; --acc-fill:#C8F751; --acc-ink:#1E2608;
  --done:#5B7A3A; --done-soft:#EAF2DA; --warn:#8A5A1F;
  --shadow:0 1px 2px rgba(20,22,20,.07);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#111310; --panel:#191C17; --ink:#EEF0EA; --ink-2:#B0B5AA;
  --grey:#868B80; --line:#2C3028; --line-2:#232720;
  --acc:#C8F751; --acc-fill:#C8F751; --acc-ink:#1E2608;
  --done:#9FC96A; --done-soft:#1D2714; --warn:#D9A867;
  --shadow:0 1px 2px rgba(0,0,0,.45);
}}
:root[data-theme="dark"]{
  --ground:#111310; --panel:#191C17; --ink:#EEF0EA; --ink-2:#B0B5AA;
  --grey:#868B80; --line:#2C3028; --line-2:#232720;
  --acc:#C8F751; --acc-fill:#C8F751; --acc-ink:#1E2608;
  --done:#9FC96A; --done-soft:#1D2714; --warn:#D9A867;
  --shadow:0 1px 2px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);margin:0;padding:0 0 48px;
  font-family:Archivo,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:600px;margin:0 auto;padding:0 18px}
header{padding:22px 0 0}
.linea{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.kicker{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--grey);font-weight:700}
.cont{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:12px;color:var(--grey);font-variant-numeric:tabular-nums}
.barra{display:flex;gap:4px;margin:10px 0 0}
.barra i{flex:1;height:5px;background:var(--line);border-radius:2px}
.barra i.ok{background:var(--done)} .barra i.now{background:var(--ink)}

.carta{margin:22px 0 0;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.cinta{background:var(--acc-fill);color:var(--acc-ink);padding:9px 18px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;display:flex;justify-content:space-between;gap:10px}
.cuerpo{padding:20px 18px 22px}
.titulo{font-family:Newsreader,Georgia,serif;font-size:28px;line-height:1.18;font-weight:500;margin:0;text-wrap:balance}
.frente{font-size:13px;color:var(--ink-2);margin:6px 0 0}
.bloque{margin:16px 0 0;padding:14px 16px;border-left:3px solid var(--line);background:var(--line-2);border-radius:0 8px 8px 0}
.bloque .et{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--grey);font-weight:700;display:block;margin-bottom:6px}
.bloque p{margin:0;font-family:Newsreader,Georgia,serif;font-size:16px;line-height:1.55;color:var(--ink)}
.bloque.hecho-si{border-left-color:var(--done);background:var(--done-soft)}
a.ir{display:block;margin:14px 0 0;padding:13px 14px;border:1px solid var(--line);border-radius:8px;text-decoration:none;color:var(--ink);font-weight:600;font-size:14px;background:var(--panel)}
a.ir span{display:block;font-weight:400;font-size:12px;color:var(--ink-2);margin-top:2px}

.quien{font-family:Newsreader,Georgia,serif;font-size:28px;line-height:1.15;font-weight:500;margin:0}
.donde{font-size:14px;color:var(--ink-2);margin:6px 0 0}
.mailfila{display:flex;gap:8px;margin:14px 0 0}
.mail{flex:1;display:flex;align-items:center;font-family:"JetBrains Mono",ui-monospace,monospace;font-size:14px;color:var(--ink);background:var(--line-2);border:1px solid var(--line);border-radius:8px;padding:12px 14px;word-break:break-all;text-decoration:none}
.sinmail{display:block;margin:14px 0 0;font-size:14px;color:var(--ink-2);background:var(--line-2);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.borrador{margin:16px 0 0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.borrador .cab{background:var(--line-2);padding:10px 14px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--grey);font-weight:700}
.borrador .asunto{padding:12px 14px;border-bottom:1px solid var(--line);font-size:14px}
.borrador .asunto b{color:var(--grey);font-weight:600;font-size:11px;letter-spacing:.08em;text-transform:uppercase;display:block;margin-bottom:3px}
.borrador pre{margin:0;padding:14px;font-family:Newsreader,Georgia,serif;font-size:15px;line-height:1.6;white-space:pre-wrap;word-wrap:break-word;color:var(--ink);background:var(--panel);max-height:260px;overflow-y:auto}

.acciones{display:flex;flex-direction:column;gap:10px;margin:20px 0 0}
button{font-family:inherit;font-size:15px;font-weight:600;padding:15px 12px;border-radius:9px;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
button.principal{background:var(--acc-fill);border-color:var(--acc-fill);color:var(--acc-ink)}
button.peq{flex:none;padding:0 14px;font-size:13px}
button:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

.fin{margin:22px 0 0;padding:22px 18px;background:var(--done-soft);border:1px solid var(--line);border-radius:12px}
.fin h2{font-family:Newsreader,Georgia,serif;font-size:24px;font-weight:500;margin:0 0 8px}
.fin p{margin:0;font-size:14px;line-height:1.6;color:var(--ink-2)}

details{margin:24px 0 0}
summary{cursor:pointer;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--grey);padding:10px 0}
.fila{display:flex;gap:11px;align-items:center;padding:11px 13px;border:1px solid var(--line);background:var(--panel);border-radius:9px;margin-bottom:6px}
.fila .n{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:12px;color:var(--grey);width:24px;flex:none}
.fila .q{flex:1;font-size:14px;line-height:1.35}
.fila .e{font-size:11px;font-weight:600;color:var(--grey);display:flex;align-items:center;gap:6px;flex:none}
.fila .e i{width:9px;height:9px;border:1.5px solid var(--grey);border-radius:50%;display:block}
.fila.ok .e{color:var(--done)} .fila.ok .e i{background:var(--done);border-color:var(--done);border-radius:2px}
.fila.now{border-color:var(--ink);border-width:2px}
.nota{font-size:12px;line-height:1.6;color:var(--grey);margin:24px 0 0}
.estado{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:11px;color:var(--grey);margin:14px 0 0}
.estado.local{color:var(--warn)}
</style>

<div class="wrap">
<header>
  <div class="linea"><span class="kicker" id="kicker">Una cosa</span><span class="cont" id="cont"></span></div>
  <div class="barra" id="barra"></div>
</header>
<div id="zona"></div>
<details id="dia"><summary>Ver el día entero</summary><div id="lista"></div></details>
<details id="colaall"><summary>Ver la cola de correos</summary><div id="listacola"></div></details>
<p class="nota">El plan lo cargo yo desde el hilo. Si algo no cuadra con lo que toca hoy, dímelo allí y lo cambio: esta página se actualiza sola.</p>
<p class="estado" id="estado">…</p>
</div>

<script>
const C=[
{q:'Alba Barneda',d:'CANADA · managing partner',m:'alba@canadacanada.com',
 a:'El dolor de los entregables: «los entregables conforman el 95% del trabajo que hace postproducción». Literal suyo, verificado a mano. Sale con el enlace a /studio — no espera a la pieza de versionado.',
 s:'Los entregables, el 95% del trabajo', b:'Hola Alba:\n\nTe escribo directo porque vengo de tu lado del oficio: retocador de imagen en Carolina Herrera, Product Manager en Zara Woman, colorimetría en Bymatallana (Nueva York) y editoriales publicadas con crédito propio.\n\nTe leí decir que los entregables conforman el 95% del trabajo que hace postproducción. Eso es exactamente lo que hago ahora, desde HERA, mi estudio de producción visual en Madrid: cojo una imagen ya rodada y la convierto en todas las versiones que hagan falta —formatos, mercados, duraciones— sin volver a montar el set. Y el retoque de piel y tejido lo firmo yo, no lo escupe una máquina.\n\nSi en algún proyecto os falta capacidad ahí, me gustaría enseñaros cómo trabajo.\n\nSi no es el momento, dímelo y no insisto.\n\nDenno Gamboa\nHERA · estudio de producción visual · Madrid\nhera-vercel.vercel.app/studio'},
{q:'Louis de Meckenheim',d:'Chopard · seguimiento del 11 de junio',m:'louis.demeckenheim@chopard.ch',
 a:'Contéstale DENTRO del hilo «Happy Diamonds · Campaign Visuals · Hello Louis» — que vea lo que le mandaste en junio sin buscarlo. Sin lista de méritos: ya los tiene arriba. Una sola idea nueva, la del Geo-Lock, porque en joyería es la objeción número uno.',
 s:'Re: Happy Diamonds · Campaign Visuals · Hello Louis', b:'Hi Louis,\n\nComing back to Happy Diamonds once, then I\'ll leave it with you.\n\nSince June I\'ve built one thing I think matters for a jewellery maison: every image I deliver is locked to the real piece — its shape, its setting, the way the diamonds sit — and checked version by version before it leaves the studio. The campaign can move. The jewel doesn\'t.\n\nThe private room is still open for Chopard: CHOPARD-PRIVE\n\nIf it\'s not the moment, tell me and I won\'t insist.\n\nBest,\nDennis'},
{q:'Felix Mondino',d:'Iconoclast · Head of Print · seguimiento',m:'felix@iconoclastimage.tv',
 a:'Enviado el 18 de agosto, el único correo del método nuevo. Veintidós días sin seguimiento.',
 s:'Sobre el versionado en print', b:'Hola Felix:\n\nTe escribí el 18 de agosto sobre versionado para print. Te sigo una vez y te dejo en paz.\n\nDesde entonces: [lo nuevo — una línea].\n\nSigue todo aquí, sin que tengas que descargarte nada: hera-vercel.vercel.app/studio\n\nSi no es el momento, dímelo y no insisto.\n\nDenno Gamboa\nHERA · estudio de producción visual · Madrid\nhera-vercel.vercel.app/studio'},
{q:'Maria Vives',d:'CANADA · head of photography',m:'maria@canadacanada.com',
 a:'Puerta B: fotografía y moda. Es tu terreno exacto, quince años haciéndolo.',
 s:'Versionado sin volver a montar el set', b:'Hola Maria:\n\nTe escribo a ti y no a producción porque lo que hago es exactamente lo tuyo. Vengo de ese lado del oficio: retocador de imagen en Carolina Herrera, Product Manager en Zara Woman, colorimetría en Bymatallana (Nueva York) y editoriales publicadas con crédito propio.\n\nAhora dirijo HERA, estudio de producción visual en Madrid: cojo una imagen ya rodada y la convierto en todas las versiones que hagan falta —formatos, mercados, duraciones— sin volver a montar el set. Y el retoque de piel y tejido lo firmo yo, no lo escupe una máquina.\n\nAlba lo puso en números: el 95% del trabajo de postproducción son entregables. Si os falta capacidad ahí, me gustaría enseñaros cómo trabajo.\n\nSi no es el momento, dímelo y no insisto.\n\nDenno Gamboa\nHERA · estudio de producción visual · Madrid\nhera-vercel.vercel.app/studio'},
{q:'Wendy',d:'Cuyana · seguimiento',m:'',
 a:'Del lote de agosto, en silencio. Búscalo en Enviados.',
 s:'Retomando', b:'Hi Wendy,\n\nI wrote to you in August. Following up once, then I\'ll leave you alone.\n\nSince then: [lo nuevo — una línea].\n\nIt\'s all here, nothing to download: hera-vercel.vercel.app/studio\n\nIf it\'s not the moment, tell me and I won\'t insist.\n\nDenno Gamboa\nHERA · visual production studio · Madrid\nhera-vercel.vercel.app/studio'},
{q:'Callum Harrison',d:'CANADA · special projects',m:'callum@canadacanada.com',
 a:'Puerta C: su punto ciego con la IA. Entra por el problema, no por la herramienta.',
 s:'Lo que ofrecen los que no vienen de la imagen', b:'Hola Callum:\n\nOs escribo por special projects porque esto no entra en una categoría existente.\n\nVengo del oficio: retocador de imagen en Carolina Herrera, Product Manager en Zara Woman, colorimetría en Bymatallana (Nueva York) y editoriales publicadas con crédito propio. Ahora dirijo HERA, estudio de producción visual en Madrid.\n\nUso herramientas generativas, pero al revés que casi todos: no para generar imagen, sino para versionar la que ya está rodada —formatos, mercados, duraciones— sin volver a montar el set. El retoque de piel y tejido lo firmo yo, no lo escupe una máquina.\n\nLa mayoría de quien os ofrece esto viene de la tecnología. Yo vengo de la imagen, y se nota en lo que sale.\n\nSi no es el momento, dímelo y no insisto.\n\nDenno Gamboa\nHERA · estudio de producción visual · Madrid\nhera-vercel.vercel.app/studio'},
{q:'Calvin Leung',d:'Cult Gaia · seguimiento',m:'',
 a:'Del lote de agosto, en silencio. Búscalo en Enviados.',
 s:'Retomando', b:'Hi Calvin,\n\nI wrote to you in August. Following up once, then I\'ll leave you alone.\n\nSince then: [lo nuevo — una línea].\n\nIt\'s all here, nothing to download: hera-vercel.vercel.app/studio\n\nIf it\'s not the moment, tell me and I won\'t insist.\n\nDenno Gamboa\nHERA · visual production studio · Madrid\nhera-vercel.vercel.app/studio'},
{q:'Ilona Klaver',d:'Iconoclast',m:'ilona@iconoclastimage.tv',
 a:'Segunda puerta en Iconoclast, distinta persona y distinto ángulo que Felix.',
 s:'Versioning without rebuilding the set', b:'Hi Ilona,\n\nI\'m writing directly because I come from this side of the craft: image retoucher at Carolina Herrera, Product Manager at Zara Woman, colour at Bymatallana (New York), and published editorials under my own credit.\n\nI now run HERA, a visual production studio in Madrid: I take a piece that\'s already been shot and turn it into every version you need — formats, markets, durations — without rebuilding the set. And the skin and fabric retouching is signed by me, not spat out by a machine.\n\nIf you\'re ever short of capacity there, I\'d like to show you how I work.\n\nIf it\'s not the moment, tell me and I won\'t insist.\n\nDenno Gamboa\nHERA · visual production studio · Madrid\nhera-vercel.vercel.app/studio'},
{q:'Víctor Mata',d:'CANADA',m:'victor@canadacanada.com',a:'Tercera pasada en CANADA.',
 s:'Versionado sin volver a montar el set', b:'Hola Víctor:\n\nVengo del oficio: retocador de imagen en Carolina Herrera, Product Manager en Zara Woman, colorimetría en Bymatallana (Nueva York) y editoriales publicadas con crédito propio. Ahora dirijo HERA, estudio de producción visual en Madrid.\n\nCojo una imagen ya rodada y la convierto en todas las versiones que hagan falta —formatos, mercados, duraciones— sin volver a montar el set. Y el retoque de piel y tejido lo firmo yo, no lo escupe una máquina.\n\nAlba lo puso en números: el 95% del trabajo de postproducción son entregables. Si os falta capacidad ahí, me gustaría enseñaros cómo trabajo.\n\nSi no es el momento, dímelo y no insisto.\n\nDenno Gamboa\nHERA · estudio de producción visual · Madrid\nhera-vercel.vercel.app/studio'},
{q:'Bernard Amsellem',d:'Iconoclast',m:'bernard@iconoclast.tv',
 a:'Ojo: su dominio es iconoclast.tv, distinto del de Felix e Ilona. Compruébalo antes.',
 s:'Versioning without rebuilding the set', b:'Hi Bernard,\n\nI come from this side of the craft: image retoucher at Carolina Herrera, Product Manager at Zara Woman, colour at Bymatallana (New York), and published editorials under my own credit.\n\nI now run HERA, a visual production studio in Madrid. I take a piece that\'s already been shot and turn it into every version you need — formats, markets, durations — without rebuilding the set. The skin and fabric retouching is signed by me, not spat out by a machine.\n\nIf it\'s not the moment, tell me and I won\'t insist.\n\nDenno Gamboa\nHERA · visual production studio · Madrid\nhera-vercel.vercel.app/studio'}
];

// plan de reserva, por si no hay conexion con el guardado
const PLAN_RESERVA={"2026-09-23":[
 {b:"B1",f:"T1 · Golpe de estado",t:"Párrafo 13 del capítulo 7",q:"Río acaba de salir por la puerta con un piloto robado. Ahí empieza el 13. Si el lunes ya lo escribiste, pégalo en el hilo y hoy va el 14.",h:"Hay un párrafo nuevo pegado en el hilo."},
 {b:"B2",f:"T3 · HERA",t:"Hacer verdad el Passport",q:"Exporta una pieza tuya desde Photoshop con Content Credentials y comprueba que se leen. Luego escribe en cinco líneas cómo compruebas el Geo-Lock: contra qué, qué miras, quién firma.",h:"Un archivo con credenciales legibles y un párrafo de método."},
 {b:"B3",f:"T5 · Skin Lab",t:"El vídeo, y escribir a vicky",q:"Haz el vídeo de Skin Lab. Luego pregúntale a vicky por qué renderizó y no descargó.",h:"Un vídeo hecho y un mensaje enviado."},
 {b:"B4",f:"La ronda",t:"Un correo de la cola",q:"",h:"",cola:true}
]};

const K='unacosa-v1'; const $=id=>document.getElementById(id);
let PLAN=PLAN_RESERVA, prog={}, ok={}, post={}, dbref=null, progref=null, colaref=null;
const hoy=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const hora=()=>new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
try{const r=JSON.parse(localStorage.getItem(K)||'{}');prog=r.prog||{};ok=r.ok||{};post=r.post||{};if(r.plan)PLAN=r.plan;}catch(_){}

function local(){try{localStorage.setItem(K,JSON.stringify({prog,ok,post,plan:PLAN}));}catch(_){}}
function marca(t,l){$('estado').textContent=t;$('estado').classList.toggle('local',!!l);}
async function guarda(){
  local();
  if(!progref){marca('Guardado solo en este dispositivo',true);return;}
  try{
    await progref.set({dias:prog,upd:new Date().toISOString()});
    await colaref.set({ok:ok,post:post,upd:new Date().toISOString()});
    marca('Guardado a salvo · '+hora());
  }catch(e){marca('Sin conexión — guardado en el dispositivo',true);}
}

function bloquesHoy(){return PLAN[hoy()]||null;}
function hechos(){return prog[hoy()]||{};}
function colaIdx(){for(let k=0;k<C.length;k++)if(!ok[k]&&!post[k])return k;for(let k=0;k<C.length;k++)if(!ok[k])return k;return -1;}

function copiar(t,btn,txt){
  const fin=()=>{btn.textContent='Copiado ✓';setTimeout(()=>btn.textContent=txt,1800);};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(fin,()=>{viejo(t);fin();});}else{viejo(t);fin();}
}
function viejo(t){const e=document.createElement('textarea');e.value=t;document.body.appendChild(e);e.select();try{document.execCommand('copy');}catch(_){}document.body.removeChild(e);}

function cartaCola(){
  const i=colaIdx();
  if(i===-1)return '<div class="bloque hecho-si"><span class="et">La cola</span><p>Está vacía. Los diez correos han salido. Díselo al hilo y montamos la siguiente.</p></div>';
  const c=C[i];
  return '<p class="frente">Correo '+(i+1)+' de '+C.length+' de la cola</p>'+
   '<h2 class="quien">'+esc(c.q)+'</h2><p class="donde">'+esc(c.d)+'</p>'+
   (c.m?'<div class="mailfila"><a class="mail" href="mailto:'+esc(c.m)+'">'+esc(c.m)+'</a><button class="peq" id="cpd">Copiar</button></div>':'<span class="sinmail">Sin dirección aquí — está en tu carpeta de Enviados</span>')+
   '<div class="bloque"><span class="et">Por dónde entrar</span><p>'+esc(c.a)+'</p></div>'+
   (c.b?'<div class="borrador"><div class="cab">El borrador — hazlo tuyo antes de enviar</div><div class="asunto"><b>Asunto</b>'+esc(c.s)+'</div><pre>'+esc(c.b)+'</pre></div>':'')+
   '<div class="acciones">'+(c.b?'<button id="cpm">Copiar el correo entero</button>':'')+
   '<button class="principal" id="env">Enviado ✓</button><button id="apl">Este no — el siguiente de la cola</button></div>';
}

function pinta(){
  const B=bloquesHoy(), H=hechos();
  const f=new Date().toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});
  $('kicker').textContent='Una cosa · '+f;
  if(!B){
    $('cont').textContent='';$('barra').innerHTML='';
    $('zona').innerHTML='<div class="carta"><div class="cinta"><span>Hoy</span></div><div class="cuerpo">'+
      '<h1 class="titulo">Hoy no hay plan cargado.</h1><p class="frente">Dímelo en el hilo y lo cargo. Mientras tanto, esto es lo que siempre vale:</p>'+
      cartaCola()+'</div></div>';
    $('dia').hidden=true; enlazaCola(); pintaCola(); return;
  }
  $('dia').hidden=false;
  let i=-1; for(let k=0;k<B.length;k++) if(!H[k]){i=k;break;}
  const n=Object.keys(H).filter(k=>H[k]).length;
  $('cont').textContent=n+' de '+B.length+' bloques';
  $('barra').innerHTML=B.map((_,k)=>'<i class="'+(H[k]?'ok':(k===i?'now':''))+'"></i>').join('');
  if(i===-1){
    $('zona').innerHTML='<div class="fin"><h2>Día cumplido.</h2><p>Los '+B.length+' bloques de hoy están hechos. Cierra. Mañana hay otro día, y ya está cargado.</p></div>';
  }else{
    const x=B[i];
    $('zona').innerHTML='<div class="carta"><div class="cinta"><span>Ahora · '+esc(x.b)+'</span><span>'+(i+1)+' de '+B.length+'</span></div><div class="cuerpo">'+
      (x.cola? '<h1 class="titulo">'+esc(x.t)+'</h1><p class="frente">'+esc(x.f)+'</p>'+cartaCola() :
      '<h1 class="titulo">'+esc(x.t)+'</h1><p class="frente">'+esc(x.f)+'</p>'+
      '<div class="bloque"><span class="et">Qué hacer</span><p>'+esc(x.q)+'</p></div>'+
      (x.h?'<div class="bloque hecho-si"><span class="et">Está hecho cuando</span><p>'+esc(x.h)+'</p></div>':'')+
      (x.u?'<a class="ir" href="'+esc(x.u)+'">'+esc(x.ul||'Abrir')+'<span>'+esc(x.ud||'')+'</span></a>':''))+
      '<div class="acciones">'+(x.cola?'':'<button class="principal" id="hecho">Hecho ✓ — el siguiente</button>')+
      '<button id="saltar">'+(x.cola?'Cerrar este bloque':'Hoy no — pasar al siguiente bloque')+'</button></div></div></div>';
    const hb=$('hecho'); if(hb) hb.onclick=()=>{ (prog[hoy()]=prog[hoy()]||{})[i]=true; guarda(); pinta(); scrollTo(0,0); };
    $('saltar').onclick=()=>{ (prog[hoy()]=prog[hoy()]||{})[i]=true; guarda(); pinta(); scrollTo(0,0); };
    if(x.cola) enlazaCola(i);
  }
  $('lista').innerHTML=B.map((x,k)=>'<div class="fila'+(H[k]?' ok':'')+(k===i?' now':'')+'"><span class="n">'+esc(x.b)+'</span><span class="q">'+esc(x.t)+'</span><span class="e"><i></i>'+(H[k]?'hecho':(k===i?'ahora':'luego'))+'</span></div>').join('');
  pintaCola();
}
function enlazaCola(bi){
  const i=colaIdx(); if(i===-1)return; const c=C[i];
  const d=$('cpd'); if(d) d.onclick=()=>copiar(c.m,d,'Copiar');
  const m=$('cpm'); if(m) m.onclick=()=>copiar('Asunto: '+c.s+'\n\n'+c.b,m,'Copiar el correo entero');
  $('env').onclick=()=>{ ok[i]=true; if(bi!=null)(prog[hoy()]=prog[hoy()]||{})[bi]=true; guarda(); pinta(); scrollTo(0,0); };
  $('apl').onclick=()=>{ post[i]=true; guarda(); pinta(); };
}
function pintaCola(){
  $('listacola').innerHTML=C.map((c,k)=>'<div class="fila'+(ok[k]?' ok':'')+'"><span class="n">'+(k+1)+'</span><span class="q">'+esc(c.q)+' · '+esc(c.d)+'</span><span class="e"><i></i>'+(ok[k]?'fuera':(post[k]?'aplazado':'pendiente'))+'</span></div>').join('');
}

pinta(); marca('Conectando…',true);
(async()=>{
  try{
    const db=await claude.use('db'); if(!db){marca('Guardado solo en este dispositivo',true);return;}
    const planref=db.doc('plan/dias'); progref=db.doc('plan/progreso'); colaref=db.doc('cola/estado');
    const [p,g,c]=await Promise.all([planref.get(),progref.get(),colaref.get()]);
    if(p.exists){const d=p.data()||{}; if(d.dias) PLAN=d.dias;}
    if(g.exists){const d=g.data()||{}; const r=d.dias||{}; Object.keys(r).forEach(f=>{prog[f]=Object.assign({},r[f],prog[f]||{});});}
    if(c.exists){const d=c.data()||{}; Object.keys(d.ok||{}).forEach(k=>{if(d.ok[k])ok[k]=true;}); Object.keys(d.post||{}).forEach(k=>{if(d.post[k]&&!ok[k])post[k]=true;});}
    local(); pinta(); marca('Plan al día · '+hora());
    planref.onSnapshot(s=>{ if(s.exists){const d=s.data()||{}; if(d.dias){PLAN=d.dias; local(); pinta();}} }, ()=>{});
  }catch(e){marca('Guardado solo en este dispositivo',true);}
})();
</script>
