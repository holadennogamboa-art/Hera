<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>El taller — Golpe de estado</title>
<style>
:root{--paper:#F3EFE6;--paper2:#FBF9F4;--ink:#1E1A14;--soft:#5C5548;--rule:#D8CEBB;--card:#FFF;
--red:#8E241F;--gold:#9A8258;--green:#3F6B4A;--sh:rgba(30,26,20,.09);
--serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;--body:Georgia,serif;
--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
@media(prefers-color-scheme:dark){:root{--paper:#131110;--paper2:#191614;--ink:#EDE5D7;--soft:#A69C8A;
--rule:#332D25;--card:#1E1B16;--red:#D9776F;--gold:#C6AE83;--green:#7FB08C;--sh:rgba(0,0,0,.4)}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);line-height:1.62}
header{position:sticky;top:0;z-index:20;background:var(--paper2);border-bottom:1px solid var(--rule);
padding:11px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{font-family:var(--serif);font-weight:600;font-size:17px;white-space:nowrap}
.brand small{font-family:var(--mono);font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;
color:var(--red);display:block;font-weight:400}
.bar{flex:1;min-width:120px;height:6px;background:var(--rule);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);width:0;transition:width .3s}
.pct{font-family:var(--mono);font-size:12px;color:var(--soft);white-space:nowrap}
button{font-family:inherit;cursor:pointer;border-radius:4px;border:1px solid var(--rule);
background:var(--card);color:var(--ink);padding:7px 13px;font-size:13.5px}
button:hover{border-color:var(--gold)}
button.p{background:var(--red);color:#fff;border-color:var(--red)}
button.p:hover{opacity:.9}
.wrap{max-width:1080px;margin:0 auto;padding:20px 18px 90px}
.caps{display:grid;grid-template-columns:repeat(auto-fit,minmax(146px,1fr));gap:9px;margin-bottom:22px}
.cap{background:var(--card);border:1px solid var(--rule);border-radius:5px;padding:11px 12px;text-align:left;
box-shadow:0 3px 9px var(--sh)}
.cap.on{border-color:var(--red);border-width:2px;padding:10px 11px}
.cap b{font-family:var(--serif);font-size:14.5px;display:block;line-height:1.25}
.cap span{font-family:var(--mono);font-size:10px;color:var(--soft);display:block;margin-top:5px}
.cap .mini{height:4px;background:var(--rule);border-radius:2px;margin-top:7px;overflow:hidden}
.cap .mini i{display:block;height:100%;background:var(--green);width:0}
.head{background:var(--card);border:1px solid var(--rule);border-left:4px solid var(--red);border-radius:5px;
padding:16px 18px;margin-bottom:16px;box-shadow:0 4px 12px var(--sh)}
.head h2{font-family:var(--serif);font-size:22px;margin:0 0 3px}
.head .song{font-style:italic;color:var(--soft);font-size:14px;margin:0 0 2px}
.head .cnt{font-family:var(--mono);font-size:11.5px;color:var(--red);letter-spacing:.1em;margin:0 0 11px}
.head .fn{margin:0;font-size:15px}
details{margin-top:12px;border-top:1px solid var(--rule);padding-top:11px}
summary{cursor:pointer;font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;
color:var(--gold);list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:" +"}details[open] summary::after{content:" −"}
details ul{margin:10px 0 0;padding-left:19px;font-size:14.5px;color:var(--soft)}
details li{margin-bottom:6px}details li b{color:var(--ink)}
.nav{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.nav .n{font-family:var(--mono);font-size:12px;color:var(--soft)}
.dots{display:flex;gap:3px;flex-wrap:wrap;flex:1;min-width:100px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--rule);cursor:pointer;border:0;padding:0}
.dot.done{background:var(--green)}.dot.now{outline:2px solid var(--red);outline-offset:1px}
.pane{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:820px){.pane{grid-template-columns:1fr}}
.box{background:var(--card);border:1px solid var(--rule);border-radius:5px;padding:15px 17px;
box-shadow:0 4px 12px var(--sh)}
.box .lab{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;
color:var(--soft);margin-bottom:9px;display:flex;justify-content:space-between}
.ref{font-size:16.5px;line-height:1.72;color:var(--soft)}
textarea{width:100%;min-height:280px;border:0;outline:none;resize:vertical;background:transparent;
color:var(--ink);font-family:var(--body);font-size:16.5px;line-height:1.72}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}
.tag{font-family:var(--mono);font-size:10px;padding:3px 8px;border-radius:3px;
background:color-mix(in srgb,var(--gold) 18%,transparent);color:var(--gold)}
.tag.s{background:color-mix(in srgb,var(--red) 15%,transparent);color:var(--red)}
.foot{position:fixed;bottom:0;left:0;right:0;background:var(--paper2);border-top:1px solid var(--rule);
padding:9px 18px;display:flex;gap:9px;align-items:center;justify-content:center;flex-wrap:wrap;z-index:20}
.st{font-family:var(--mono);font-size:11px;color:var(--soft);margin-left:6px}
.rules{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;display:none;align-items:center;
justify-content:center;padding:20px}
.rules.on{display:flex}
.rules>div{background:var(--card);border-radius:6px;padding:24px 26px;max-width:560px;max-height:82vh;overflow:auto}
.rules h3{font-family:var(--serif);margin:0 0 14px;font-size:20px}
.rules ol{margin:0;padding-left:20px;font-size:15px}.rules li{margin-bottom:9px}
</style></head><body>
<header>
 <div class="brand">El taller<small>Golpe de estado</small></div>
 <div class="bar"><i id="gb"></i></div><div class="pct" id="gp">0 / 132</div>
 <button onclick="document.getElementById('rl').classList.add('on')">Las reglas</button>
</header>
<div class="wrap">
 <div class="caps" id="caps"></div>
 <div class="head" id="head"></div>
 <div class="nav">
  <button onclick="mov(-1)">←</button><span class="n" id="pos"></span>
  <div class="dots" id="dots"></div><button onclick="mov(1)">→</button>
 </div>
 <div class="pane">
  <div class="box"><div class="lab"><span>El borrador — solo referencia</span><span id="rw"></span></div>
   <div class="ref" id="ref"></div><div class="tags" id="tags"></div></div>
  <div class="box"><div class="lab"><span>Tu versión</span><span id="mw"></span></div>
   <textarea id="ta" placeholder="Escribe aquí con tus palabras…"></textarea></div>
 </div>
</div>
<div class="foot">
 <button class="p" onclick="hecho()">Marcar hecho y seguir →</button>
 <button onclick="conectar()" id="fsb">Conectar carpeta</button>
 <button onclick="exportar()">Exportar capítulo</button>
 <span class="st" id="st">guardando en este navegador</span>
</div>
<div class="rules" id="rl" onclick="if(event.target===this)this.classList.remove('on')"><div>
 <h3>Las reglas que no se rompen</h3><ol id="rls"></ol>
 <button style="margin-top:16px" onclick="document.getElementById('rl').classList.remove('on')">Cerrar</button>
</div></div>
<script>
const D={"caps": [{"n": 7, "t": "EL DISFRAZ II", "song": "«Mi enfermedad» — Andrés Calamaro (1997)", "c": "Faltan veintidós días.", "fn": "Ari fabrica la armadura y Río ensaya las excusas. Es el capítulo de las explicaciones preparadas: aquí se siembra el «ensayó dos anécdotas» del 11.", "reglas": ["El altavoz sigue APAGADO.", "Ari nunca enseña una marca: la tapa. Manga larga, cuello alto, cazadora buena.", "Las excusas de Río tienen que salir solas, sin darles importancia y mirando ya para otro lado.", "No expliques por qué las tiene ensayadas. Que se note solo."], "k": "SIETE", "items": [{"t": "La crónica bajó de noche. Antes esperaba a la carrera de las seis para saber de ellos, pero el día tiene un sótano y ahí abajo está lo que no se cuenta corriendo. Esta semana le toca a Río. Y a Río hay que entrarlo por donde parece más limpio y está más sucio: por el amor.", "w": 57, "d": ["la crónica"], "s": []}, {"t": "A Río lo quisieron bien. Eso primero, porque lo explica casi todo. No a medias ni de pasada: con paciencia, del amor que llega temprano y se queda a ordenarte la casa. Él los fue devolviendo de uno en uno. Enteros por fuera. Por dentro no.", "w": 46, "d": [], "s": []}, {"t": "Hubo uno que aprendió a hacerle el café como le gustaba y una noche dejó su cepillo de dientes en el vaso, sin preguntar. A Río ese cepillo le dio miedo. Decía quédate. Empezó a romperlo esa misma noche, despacio, aflojando un tornillo por día hasta que la cosa se cae sola y parece que no fue nadie.", "w": 58, "d": [], "s": []}, {"t": "El del cepillo de dientes le hacía el café en un cazo, no en cafetera, porque decía que el cazo lo hacía más suyo. Se lo dejaba en la mesilla antes de irse a trabajar, con un plato debajo por si se derramaba, y en el plato una galleta que Río no se comía nunca. La galleta volvía a aparecer al día siguiente, igual, sin reproche. Eso fue lo primero que Río no supo perdonar: la galleta que volvía.", "w": 79, "d": [], "s": []}, {"t": "El primer tornillo lo aflojó un martes y fue una cosa mínima: dejó sin contestar un mensaje que no pedía respuesta. Nada más. Los siguientes vinieron solos, uno por día, todos igual de pequeños —llegar veinte minutos tarde sin avisar, contar un plan ya cerrado en lugar de proponerlo, decir estoy cansado en el tono exacto que no admite preguntas—. Ninguno era motivo de nada. Juntos eran una demolición.", "w": 69, "d": [], "s": []}, {"t": "Y en la puerta, no decir. Eso era lo que mejor se le daba: ni el portazo ni la explicación, sino la explicación a medio dar, para que el otro se marchara creyendo que había entendido mal. Los que se van con la razón se curan. Los que se van con la duda llaman tres meses después para preguntar qué hicieron mal. Río tenía un pequeño archivo de gente educada preguntando qué habían hecho mal, y lo llevaba encima a todas partes, como se lleva un bolsillo con piedras.", "w": 89, "d": [], "s": []}, {"t": "No hubo gritos. Eso es lo que cuesta creer. Hubo buenos modales. Río daba lo justo para que no se fueran y quitaba lo justo para que tampoco se quedaran del todo. Los dejaba en la puerta, ni dentro ni fuera, sangrando despacio y sin marca. Al que no falla no hay cómo perdonarlo, y a él lo querían sin pedirle cuentas, y las cuentas eran lo único que sabía leer. Un amor que no le exigía nada no lo entendía. Así que rompía lo que estaba sano. Necesitaba que doliera para creérselo.", "w": 93, "d": [], "s": []}, {"t": "Pero esos no eran los que buscaba de madrugada. La crónica ya estuvo en esos pisos con las cortinas cerradas para que no entrara la mañana, ya vio al artista herido haciendo reír a gente que no lo conocía. Lo que no dijo es a quién buscaba Río de verdad ahí dentro.", "w": 52, "d": ["la crónica"], "s": []}, {"t": "A los que pegaban. Manos rápidas, cariño roto, gente que confundía querer con tener. Los olía de lejos y se iba derecho, con una cara de no haber roto un plato que era pura puntería. Necesitaba el golpe. Esto no cabe en ninguna sinopsis: no le bastaba con destrozar, quería que lo destrozaran a él, unas manos que no lo trataran como algo que vale. Y sabía provocarlo. Se conocía el punto flaco de cada uno y empujaba, con esa sonrisa de tirantes y ojos buenos, hasta que la boca más amable se cerraba en un puño. Entonces llegaba lo que venía a buscar: el labio partido, la marca en la muñeca, un cuerpo que por un segundo lo odiaba en serio. En ese segundo se sentía real. Querido, a su manera torcida.", "w": 133, "d": [], "s": []}, {"t": "Después, el ritual. Y esta es la parte bonita de una cosa fea, por eso da no sé qué contarla. Se encerraba en el baño de turno —un hotel por horas, una cocina ajena, un portal—, se lavaba la cara despacio, se subía los tirantes. Se abrochaba la camisa botón a botón y se alisaba las arrugas con la mano hasta que no quedaba ninguna. Ninguna. Una perfección que ni era suya: se la copiaba al de la geometría, al que planchaba de madrugada como si eso salvara a alguien. Río se la ponía como quien roba un abrigo para aguantar el invierno.", "w": 103, "d": [], "s": []}, {"t": "Lo del día siguiente era otra ingeniería, y esa sí la tenía escrita. Río llevaba en la cabeza un catálogo de prendas por zonas: manga larga para las muñecas, cuello alto para el cuello, la cazadora buena para todo lo demás. Se vestía delante del espejo comprobando ángulos, girando el hombro, levantando el brazo a ver hasta dónde subía la tela, con la concentración de quien revisa una obra antes de que llegue la visita.", "w": 75, "d": [], "s": []}, {"t": "Y luego estaban las explicaciones, que era la parte fina. Tenía tres o cuatro, cortas, de las que no invitan a una segunda pregunta: la puerta del armario, el bordillo, un mal día en el gimnasio. Las soltaba sin darles importancia, con media sonrisa, mirando ya para otro lado, y funcionaban siempre, porque la gente prefiere una explicación mala a una conversación larga. Las tenía tan ensayadas que le salían solas, igual que le salían las anécdotas.", "w": 77, "d": [], "s": []}, {"t": "Por fuera, ni una arruga. Por dentro, el corazón hecho una bola de papel: apretado en un puño y luego estirado sobre la mesa, con los pliegues ya para siempre. Ese era el disfraz de verdad, no la capa de Drácula esperando en una caja a veintidós días de la fiesta. Una camisa impecable encima de algo arrugado. Río no necesitaba ganar ningún premio al mejor disfraz. Lo ganaba cada madrugada, sin que nadie votara.", "w": 75, "d": [], "s": []}, {"t": "Y si la crónica pudiera hacer lo que hace la memoria, esa noche subiría. Cenital, desde arriba, sin opinar. Tres habitaciones encendidas a la misma hora, cada una con su lámpara pequeña de luz naranja recortada contra el azul de la ventana. En una, Ari de rodillas delante de alguien que podría haberlo criado, aguantando el desprecio igual que se traga una medicina amarga: que le repitan que no vale, que no va a ser perfecto, que no va a llegar a ser él. La camisa planchada en la silla, esperándolo. En otra, Río frente al espejo, alisándose esa misma camisa, el labio hinchado, ensayando una sonrisa para ver si todavía le sale. En la tercera, Darío en el suelo hecho un ovillo con un animal pequeño lamiéndole las manos, contándole al oído lo que no le ha contado a nadie, porque en ese bicho tibio le caben todas las heridas que aún no cierran.", "w": 155, "d": ["la crónica"], "s": []}, {"t": "Tres habitaciones. Tres corazones rotos. Y la crónica, desde arriba, no baja a explicar lo único imposible del plano: que en las tres, a la vez, exactamente a la vez, se está acabando la misma canción.", "w": 36, "d": ["la crónica"], "s": []}, {"t": "Río cerró la puerta. En la calle la camisa no tenía una arruga y nadie que se cruzara con él habría notado la bola de papel que llevaba debajo. Caminó impecable bajo las farolas, hacia la esquina donde en un rato tres hombres sin dormir se dirían buenos días. Detrás, en dos ventanas que él nunca miró, la canción se acabó a la vez que la suya.", "w": 67, "d": [], "s": []}, {"t": "·   ·   ·", "w": 3, "d": [], "s": []}, {"t": "Es de noche en la habitación de siempre. Una enfermera estira la sábana sobre un cuerpo quieto y le pasa la mano para que no quede ni una arruga, con esa costumbre que ya no espera respuesta. En la mesilla hay un papel doblado y vuelto a doblar que nadie ha conseguido alisar. En el parte pondrán: estable, tranquilo, ha descansado. Nadie apunta que, muy bajito, en algún aparato, se acaba de terminar una canción.", "w": 75, "d": [], "s": []}, {"t": "·   ·   ·", "w": 3, "d": [], "s": []}]}, {"n": 8, "t": "EL CUARTO DE AL LADO", "song": "Sin música. Nunca compartió ninguna.", "c": "Faltan dieciocho días.", "fn": "El padre. El capítulo más difícil y el que sostiene el libro: la única herencia fue una zancada, y la caja de zapatos se aprendió de un estado de cuenta.", "reglas": ["SIN MÚSICA. Es el único capítulo sin canción y eso significa algo.", "El padre nunca tiene cara entera. Fragmentos: manos, un brazo planchando, una puerta.", "Nunca entres en la casa. El derecho a la oscuridad se respeta.", "Ningún nombre real: ni el suyo, ni bancos, ni comercios."], "k": "OCHO", "items": [{"t": "Hay una hora, entre las cuatro y las cinco, en la que Madrid no defiende a nadie. La crónica ya se la sabe. Esa noche subió a mirar esperando lo de siempre —un insomnio, un hombre planchando, alguien volviendo a casa con la ropa de ayer— y se encontró con otra cosa. Se encontró a los tres dormidos. Y por una vez, dormidos era peor.", "w": 65, "d": ["la crónica"], "s": []}, {"t": "Río sueña y tiene seis años. En el sueño la cama está mojada y él lo sabe antes de despertarse, con esa vergüenza que llega antes que el frío. Después se abre la puerta. Entra el hombre que duerme en el cuarto de al lado y no grita —eso es lo que hay que entender, que no grita nunca—, coge la ropa interior sucia y se la pasa por la cara. Despacio. Con método. Como quien le enseña algo a un animal, sin rabia, casi con paciencia, para que aprenda. Para que no lo vuelvas a hacer. Y el niño no lo vuelve a hacer. Nunca más. Aprende esa noche una cuenta que le va a durar treinta años: lo que sale de ti es la prueba de lo que eres. Por eso, tres décadas después, hay un hombre de treinta y cinco años buscando por Madrid unas manos que se lo repitan. Que le recuerden con el cuerpo que es casi una mierda. Es el único idioma en el que alguien le habló de cerca, y uno vuelve a donde lo entienden.", "w": 183, "d": [], "s": []}, {"t": "Ari no sueña con nadie. Ari sueña con un acertijo. Está dentro de una cosa que es medio examen y medio pasillo, y hay una respuesta que se le escapa por poco, siempre por poco, y él da vueltas. Vuelta y vuelta, muy correcto, muy erguido, sin despeinarse ni en sueños. Lo malo del acertijo no es que no tenga solución. Es que la solución es él, y en algún sitio lo sabe, y por eso sigue caminando en círculo en lugar de resolverlo. En el centro del círculo hay una puerta. Es la del cuarto de al lado. Ari no la abre. Sabe quién hay dentro y sabe que si la abre se va a encontrar a sí mismo con treinta años más y la misma cara, y prefiere el círculo. El círculo, al menos, es limpio.", "w": 138, "d": [], "s": []}, {"t": "Darío no sueña porque no duerme. Da vueltas por la habitación. Cuatro pasos y la pared, cuatro pasos y la ventana, y otra vez. El animal pequeño lo sigue con los ojos desde la cama sin entender nada, y en algún momento se rinde y se duerme, que es lo único sano que pasa en toda la noche. Darío camina. Y camina exactamente como caminaba alguien por un pasillo hace treinta años, con ese peso, a esa hora, y él lo sabe perfectamente, y por eso no se sienta.", "w": 89, "d": [], "s": []}, {"t": "Aquí la crónica tiene que anotar una cosa que no sabe explicar. Tres hombres. Tres casas distintas, tres infancias distintas, tres barrios que no se tocan. Y en las tres hay un cuarto al lado. El mismo pasillo. El mismo papel en la pared, con esas flores que ya no se ven en ningún sitio. La misma puerta que no cierra del todo. La crónica lo apunta y sigue, porque a ella no le pagan por entender.", "w": 77, "d": ["la crónica"], "s": []}, {"t": "A las cinco y media suena el despertador. Tres despertadores distintos, la misma hora.", "w": 14, "d": [], "s": []}, {"t": "Río se levanta como puede. Se ducha con el agua demasiado caliente, un rato largo, y sale. Y entonces empieza lo suyo: pone la canción antes que la luz. Fey. Azúcar amargo. La deja sonar mientras se pone la crema anti-age con el dedo anular, dando toquecitos, porque es el dedo que menos fuerza tiene y eso lo leyó en algún sitio. Después el sérum, dos gotas, cuello incluido. Después el pelo, con calma, mirándose a los ojos en el espejo. Y en esos ojos no hay absolutamente nada que diga que hace veinte minutos tenía seis años y la cara sucia. Nada. Está impecable. Canturrea el estribillo entre dientes. Eso es lo que hace Río todas las mañanas de su vida: echarle azúcar. Kilos. Y funciona. Funciona hasta que se acaba el azúcar.", "w": 134, "d": [], "s": []}, {"t": "La canción se termina a mitad del peinado. Río no pone otra. Se queda un segundo con el peine en la mano, en un baño sin música, y ese segundo es lo más honesto que va a pasarle en todo el día. Ahí entra el silencio en este capítulo y ya no se va.", "w": 54, "d": [], "s": []}, {"t": "Porque del hombre del cuarto de al lado no hay banda sonora. La crónica lo ha buscado y no hay nada: ni un disco, ni una radio encendida mientras se afeitaba, ni un tarareo en una cocina, ni una canción del coche. Nada que se pudiera heredar. Y conviene decirlo claro, porque es fácil equivocarse con esto: se puede no pegar nunca y aun así llenar una casa de una cosa que pesa. El silencio de esa casa no era falta de ruido. Era algo que alguien decidía cada día, al levantarse, igual que se decide qué ropa ponerse.", "w": 99, "d": ["la crónica"], "s": []}, {"t": "Salvo una cosa. Y la crónica tardó treinta años en verla, que es exactamente lo que tardan estas cosas.", "w": 19, "d": ["la crónica"], "s": []}, {"t": "El hombre del cuarto de al lado corría. Corría de verdad: carreras populares los domingos por la mañana, dorsal sujeto con cuatro imperdibles, gorra blanca, y esa foto de antes de la salida apoyado en la valla, con la cara de los que van a hacer una cosa que no le importa a nadie más. Kilómetros y kilómetros por su cuenta, todas las semanas, durante años.", "w": 66, "d": [], "s": []}, {"t": "A ninguno de los tres le enseñó nadie a correr. Y sin embargo los tres corren. A las seis menos diez, todas las mañanas, sin faltar una sola.", "w": 28, "d": [], "s": []}, {"t": "Eso fue lo único que pasó por debajo de aquella puerta que no cerraba del todo. No una canción, no una frase, no una manera de abrazar: una zancada. La única herencia de aquella casa fue el movimiento de irse, y ninguno de los tres lo supo nunca. Se pasaron la vida haciendo cada mañana, sin saberlo, la única cosa que su padre les había enseñado sin querer enseñarles nada.", "w": 70, "d": [], "s": ["una zancada"]}, {"t": "Y hay algo más, que la crónica escribe con la mano floja. Los dos querían lo mismo. Vínculos distintos, mismo objeto: querían entera a la misma persona, y en una casa pequeña eso no cabe dos veces. Nunca hubo una pelea por ello, ni una escena, ni un portazo. No hizo falta. Se compite muchísimo mejor en silencio, durante treinta años, sin nombrarlo una sola vez.", "w": 66, "d": ["la crónica"], "s": []}, {"t": "Treinta años después, una tarde cualquiera, uno de los tres se puso a buscar fotos suyas. Escribió el nombre en el buscador del teléfono y esperó. Salieron diez resultados. Diez. Un carné de identidad fotografiado por las dos caras, dos tarjetas de embarque, la portada de un libro, un par de documentos escaneados con prisa, el recordatorio de un funeral que no era el suyo. Ni una foto de los dos. Ni una foto de él solo, quieto, mirando a la cámara sin ningún motivo administrativo.", "w": 86, "d": [], "s": []}, {"t": "Del padre no quedaban recuerdos: quedaban trámites. Y el hijo —que llevaba media vida guardando tickets en una caja de zapatos para poder demostrar que había estado en los sitios— apagó la pantalla y no supo si aquello le daba pena o le daba risa, porque las dos cosas eran verdad y venían juntas.", "w": 54, "d": ["la caja de zapatos", "los tickets"], "s": []}, {"t": "Y no era la primera vez que lo comprobaba. Hubo unos años, cuando el hijo estudiaba en una ciudad enorme al otro lado del mundo, en que los dos se escribieron bastante. Es un decir. El hijo escribía; el padre adjuntaba.", "w": 41, "d": [], "s": []}, {"t": "Los correos del hijo eran largos y estaban llenos de signos de exclamación, que es como escribe la gente que necesita que le contesten. Que los echaba de menos. Que nunca lo llamaban. Que seguro ya se habían olvidado de él. Que por favor le devolvieran la llamada de una vez. Una vez mandó una foto de sus padres juntos en un puente colgante y explicó, con cierto orgullo, que le había retocado los colores para que la foto quedara más bonita. Ya entonces se dedicaba a arreglar imágenes de la familia para que se vieran mejor de lo que eran.", "w": 101, "d": [], "s": []}, {"t": "Las respuestas del padre eran de otra naturaleza. Sin asunto, sin saludo, sin una sola línea escrita: un archivo adjunto. Un estado de cuenta. El movimiento del dinero, ordenado por fecha contable y fecha de transacción, con su columna de débitos y su columna de créditos y el saldo inicial arriba del todo.", "w": 53, "d": [], "s": []}, {"t": "Ahí estaba la vida del hijo, renglón a renglón: un cine, una hamburguesa, un supermercado, tres avances de efectivo seguidos con sus comisiones correspondientes. Todo lo que había hecho aquel mes, contado por un banco. Alguien podría decir que un padre que manda eso está cuidando a su hijo, y no sería mentira. Casi nunca es mentira. Por eso cuesta tanto explicarlo.", "w": 62, "d": [], "s": []}, {"t": "De ahí viene la caja de zapatos. Eso la crónica lo entendió aquella tarde y no antes. Al hijo no se le ocurrió a él lo de guardar los tickets: se lo enseñaron. Aprendió que una vida se puede demostrar con papeles, que los papeles se ordenan por fecha, y que cuando no hay nada que decirle a alguien siempre se le puede mandar la cuenta. Lo único que cambió fue el destinatario. Se pasó treinta años archivando para nadie.", "w": 80, "d": ["la caja de zapatos", "los tickets", "la crónica"], "s": ["archivando para nadie"]}, {"t": "Lo que hicieron los tres con esa herencia, cada uno por su cuenta, explica todo lo demás. Ari lo volvió método: si no hay un fallo, no hay motivo, y si no hay motivo no se abre la puerta. Río lo volvió ruido: música, chistes, gente riéndose, lo que sea con tal de que no se oiga el fondo. Darío lo volvió contabilidad: apuntarlo todo, guardarlo todo, tener siempre el ticket por si alguien pregunta. Ninguno eligió. A los seis años no se elige, se sobrevive con lo que hay a mano; lo jodido es que luego te pasas la vida entera creyendo que eso era tu carácter.", "w": 108, "d": ["los tickets"], "s": []}, {"t": "Faltaban dieciocho días para la fiesta. Los tres iban a ir de lo mismo: de tipo elegante con buenos modales, de horror con la raya bien hecha, de eso que vivía en la casa de al lado y comía en la misma mesa. Y a ninguno se le había ocurrido que llevaban ensayando ese disfraz desde los seis años.", "w": 59, "d": [], "s": []}, {"t": "La crónica cerró el cuaderno antes de tiempo esa noche. Hay cosas que se apuntan y no se releen.", "w": 19, "d": ["la crónica"], "s": []}, {"t": "·   ·   ·", "w": 3, "d": [], "s": []}, {"t": "Alguien empuja un carro con una rueda mala por el pasillo. Hay una puerta que no cierra del todo. En la habitación del fondo hay un hombre despierto con los ojos cerrados, esperando a que el ruido pase de largo, como lleva esperando desde los seis años. En el parte de noche no escribirán nada, porque no ha pasado nada. Es de noche y no suena ninguna canción.", "w": 68, "d": [], "s": []}, {"t": "·   ·   ·", "w": 3, "d": [], "s": []}]}, {"n": 9, "t": "EL DISFRAZ III", "song": "«Quizás» — Enrique Iglesias (2002) — por la megafonía", "c": "Faltan catorce días.", "fn": "La agencia, el trabajo, el pósit con su nombre escrito por otro. Y al final: la semana en que la cuenta se desboca.", "reglas": ["El altavoz sigue APAGADO. «Quizás» suena por megafonía, no en el altavoz.", "Ninguna marca real de la agencia ni del cliente.", "La aceleración se cuenta por dentro: sin método, sin procedimiento, nada utilizable.", "«Nadie preguntó porque desde fuera no estaba pasando nada malo.»"], "k": "NUEVE", "items": [{"t": "Con Darío la crónica tiene un problema técnico que ya no puede seguir disimulando: se le escurre. Lleva ocho capítulos y si ahora tuviera que decir de qué color tiene los ojos, o cómo es su cocina, o qué hace los domingos por la tarde, no sabría. De Ari podría dibujar el armario entero. De Río sabe hasta la textura del insomnio. De Darío hay una figura y, alrededor, un margen en blanco. La crónica lo había achacado a discreción. Esta semana, catorce días antes de la fiesta, empieza a sospechar que es otra cosa, y prefiere no averiguar cuál.", "w": 100, "d": ["la crónica"], "s": []}, {"t": "Se sabe esto, que es poco: Darío trabaja en una agencia. Entra a las nueve, saluda por su nombre a todo el mundo y lleva colgada del cuello una tarjeta con una palabra que no le corresponde a un hombre de treinta y cinco años. Becario, o algo con más maquillaje encima. Cobra lo que llaman una ayuda al estudio, que es dinero que no llega a llamarse sueldo, y hay un papel firmado con una fecha de final escrita desde el principio. En esa oficina todos dan por hecho que tiene veintipocos. Nadie pregunta. Darío tampoco corrige: corregir sería contar.", "w": 101, "d": [], "s": []}, {"t": "Del primer día Darío no guardó el edificio. Guardó un pósit. Cuando llegó a su mesa, el equipo estaba allí esperándolo: una tableta de dibujo todavía dentro de la caja, un cable enrollado, un cuaderno azul sin estrenar. Y pegado encima de la caja, un papel amarillo con su nombre escrito a mano —nombre y apellido, con una letra que no era la suya— y debajo el nombre de la empresa. Así se entra en un sitio: alguien escribe cómo te llamas para saber de quién es la caja. Darío despegó el pósit con cuidado, lo dobló en cuatro y se lo guardó. No supo explicarse por qué, y la crónica no se lo preguntó.", "w": 115, "d": ["la crónica"], "s": []}, {"t": "El edificio no parecía una oficina sino un museo al que hubieran despedido los cuadros. Se entraba por un vestíbulo con el suelo tan pulido que devolvía a la gente entera, boca abajo, y a la derecha una pared de píxeles azules encendía y apagaba el nombre de la casa. Encima de todo, en letra de neón manuscrita y en inglés, la empresa había escrito lo que creía ser; Darío pasaba por debajo de esa frase cinco días por semana y nunca se le ocurrió preguntarse si lo incluía a él. Los tornos eran de cristal y se abrían con un chasquido educado: su tarjeta abría uno, y las de los demás ponían otra cosa. Había un sofá curvo del color de la nata, dos mesas bajas verdes, un árbol de verdad plantado dentro del edificio al que alguien regaba los martes, y una cristalera de colores que a media mañana echaba sobre el suelo una alfombra que no era de nadie. Darío la cruzaba deprisa. Le parecía demasiado bonita para pisarla con la tarjeta que llevaba.", "w": 177, "d": [], "s": []}, {"t": "Y el trabajo consistía en mirar a gente que no existía. Una marca de barritas quería un anuncio y alguien le había pedido las imágenes a una máquina: cuarenta y nueve viñetas de una chica corriendo por un bosque, sudando lo justo, mordiendo con una felicidad que no le cabía en la cara. El encargo de Darío era señalar los fallos. Ponía rayitas blancas encima: aquí la mano tiene seis dedos, aquí la sombra va al revés, aquí la cara se deshace si la miras mucho rato. Se pasaba el día corrigiendo a una corredora que no había corrido nunca. Y a las seis de la mañana siguiente corría de verdad, con dos hombres. Nunca se le ocurrió pensar las dos cosas a la vez. La crónica tampoco, y de eso sí que se avergüenza.", "w": 135, "d": ["la crónica"], "s": []}, {"t": "Y aquí hay un segundo contador que en este libro no ve nadie. Mientras la crónica va restando días para la fiesta, Darío resta horas. Son quinientas en total y él sabe exactamente cuántas lleva gastadas, con la misma precisión con la que sabe lo que costaba el café con leche del ticket más viejo de la caja. Las apunta a lápiz. Cuando se acaben las horas se acaba el papel, y detrás del papel no hay nada preparado. Nadie más en esa oficina lleva esa cuenta. Es suya. La lleva solo.", "w": 92, "d": ["los tickets", "la crónica"], "s": []}, {"t": "En la agencia, Darío es el que da las gracias. Gracias por el hueco, gracias por la confianza, gracias por el ordenador bueno. Se queda hasta tarde sin que nadie se lo pida, porque las horas que regala fuera de horario no se las descuentan del contador; ese es su cálculo secreto y es un pésimo negocio, y él lo sabe perfectamente. Cuando alguien le pregunta qué tal, dice que muy bien. Lo dice rápido, para que la frase no tenga dónde apoyarse.", "w": 83, "d": [], "s": []}, {"t": "Donde de verdad se le ve es en el supermercado. Ahí la crónica por fin lo alcanza, porque ahí Darío va deprisa. Se sabe el mapa entero: qué pasillo remata a las ocho, qué etiqueta amarilla es rebaja de verdad y cuál es decoración, qué cadena devuelve sin ticket y cuál se pone difícil. Se mueve con la soltura del que por fin juega en su campo, casi contento, y eso es lo más parecido a la felicidad que este libro le ha visto hacer. Iba por el pasillo de las conservas, con la cesta colgada del codo, cuando la megafonía puso la de Enrique. Quizás.", "w": 106, "d": ["los tickets", "la crónica"], "s": ["por fin"]}, {"t": "Y Darío se paró. Con la cesta en el codo, en un pasillo de conservas, un martes, debajo de esa luz de supermercado, verde y blanca, la única del día que caía pareja sobre todos, sin sombras y sin favoritos, tratándolo por una vez igual que a cualquiera. Un empleado pasó por su lado arrastrando un palé y tuvo que apartarse. La canción siguió sonando, que es lo que hacen las canciones en los supermercados. Darío parpadeó dos veces. Después terminó la compra, comparó dos marcas de garbanzos, se quedó con la de abajo y pagó con la tarjeta que le queda corta a final de mes. La crónica no sabe qué pasó exactamente en ese pasillo, y esta vez no piensa preguntarlo.", "w": 123, "d": ["el parpadeo doble", "la crónica"], "s": []}, {"t": "La capa la encontró un jueves. Estaba en el contenedor de ropa usada de la esquina, asomando entre dos abrigos de señora, con una costura reventada de arriba abajo. Darío la sacó, la dobló en cuatro y se la llevó bajo el brazo, y por la calle no parecía un hombre recogiendo algo de la basura sino un hombre que acaba de comprarse una cosa. Esa noche la cosió en la mesa de la cocina, bajo la lámpara pequeña, con el único foco de luz de toda la casa cayéndole justo sobre la aguja. Dos horas, puntada pequeña, sin música y sin prisa. Cuando terminó no se veía por dónde había estado rota. Es el único Drácula de segunda mano de esta historia y es también, de largo, el mejor cosido, y las dos cosas son verdad al mismo tiempo.", "w": 140, "d": [], "s": []}, {"t": "De los tres disfraces, el suyo es el único que nadie va a mirar dos veces. El de Ari lleva etiqueta. El de Río lleva historia. El de Darío lleva puntada invisible, que viene a ser lo mismo que decir que no lleva nada debajo, que está bien, que no hay de qué preocuparse. Y eso es exactamente lo que él necesita que se piense.", "w": 65, "d": [], "s": []}, {"t": "El animal pequeño lo miró coser desde la silla de al lado, con esos ojos claros de agua que tenía, hasta que se durmió abrazada a un peluche gris con las cuatro patas. A esas alturas ya era la única criatura de Madrid que sabía cómo respira Darío cuando no hay nadie mirando.", "w": 53, "d": [], "s": []}, {"t": "A la mañana siguiente corrió con los otros dos. Catorce días. Llevaba el altavoz en el bolsillo, apagado, como llevaba semanas, y nadie dijo nada porque ya nadie lo esperaba encendido. Ari habló de una cuenta y de lo que se merecía. Río se rió de algo que no tenía tanta gracia. Darío contestó lo justo y aguantó el ritmo, cuesta arriba, tres respiraciones y una zancada, y no dijo que le quedaban ciento y pico horas, ni que detrás de su puerta había una capa cosida colgada de una percha. Se habla corriendo o no se habla, dice la constitución. Lo que la constitución no dice es que corriendo también se calla muy bien, y que resulta más fácil.", "w": 120, "d": ["el altavoz (nuez)"], "s": ["una zancada"]}, {"t": "Y a partir de aquí la cuenta se le desbocó.", "w": 10, "d": [], "s": []}, {"t": "Los días siguientes se juntaron unos con otros. No es una manera de hablar: se juntaron. El martes empezaba antes de que terminara el lunes, y el jueves se le apareció dos veces. La crónica intentó llevar el registro como siempre —fecha, hora, qué pasó— y a mitad de semana descubrió que llevaba dos páginas escribiendo el mismo día con nombres distintos.", "w": 62, "d": ["la crónica"], "s": []}, {"t": "Dormía poco y no lo echaba de menos. Esa es la parte que no se cuenta bien nunca y hay que contarla: no estaba agotado. Estaba mejor. Se levantaba antes de que sonara nada, con las piernas ya listas y una claridad en la cabeza que llevaba años sin visitarlo. Contestaba correos a las cuatro de la mañana y los contestaba bien. En la agencia empezaron a decirle que se le veía distinto, y él lo entendió como lo que parecía: un elogio.", "w": 83, "d": [], "s": []}, {"t": "Y las cosas empezaron a encajar. Todas. Una canción en el supermercado que decía justo lo que estaba pensando. Una matrícula con las mismas cifras que un ticket viejo. Una frase suelta de un desconocido en el metro que contestaba a una pregunta que él no había hecho en voz alta. Al principio le hizo gracia. Después le pareció interesante. Después dejó de parecerle casualidad, y esa fue la única frontera que cruzó sin enterarse de que la estaba cruzando.", "w": 80, "d": ["los tickets"], "s": []}, {"t": "Las carreras de aquella semana fueron las mejores del año. Salían a menos diez y volvían con el sol ya alto, y él tiraba en las cuestas sin sentirlas. Ari, que competía con todo, tuvo que apretar dos veces para no quedarse. Río se rio y dijo algo sobre que le habían cambiado el motor. Nadie preguntó qué estaba pasando, porque desde fuera no estaba pasando nada malo: solo un hombre en su mejor forma.", "w": 75, "d": [], "s": ["desde fuera no estaba pasando nada malo"]}, {"t": "En el trabajo se quedaba hasta que apagaban la mitad de las luces. Las horas del contador se le iban de nueve en nueve, de diez en diez, y las regalaba con una alegría rara, con el gusto del que vacía un depósito por ver cómo baja. Nadie se lo pidió. Nadie lo notó. Es asombroso lo poco que se nota un hombre acelerándose al lado de una máquina de café.", "w": 71, "d": [], "s": []}, {"t": "La capa llevaba días colgada detrás de la puerta, cosida y planchada. Entraba en la habitación y la miraba. Salía, volvía a entrar y la volvía a mirar. No se la probó ni una vez más: le bastaba con comprobar que seguía ahí, igual que se comprueba una fecha.", "w": 49, "d": [], "s": []}, {"t": "Y una noche, tarde, hizo una cosa pequeña que la crónica anotó sin entenderla y que ahora, al releer el cuaderno, es la única entrada de esa semana que le da miedo. Se levantó, fue hasta el pasillo y comprobó que la puerta estaba cerrada. Volvió a la cama. A los diez minutos se levantó otra vez y la volvió a comprobar. La puerta estaba cerrada las dos veces. En el margen, con su letra, la crónica había escrito: no pasa nada. Y a estas alturas ya no sabe si aquello era una constatación o una súplica.", "w": 97, "d": ["la crónica"], "s": ["no pasa nada"]}, {"t": "De los otros dos, aquella semana, apenas hay apuntes. Casi todo lo que queda son notas de una línea, escritas de madrugada, y varias están sin terminar. La última dice: mañana llueve. Nada más. Mañana llueve.", "w": 36, "d": [], "s": []}, {"t": "La crónica cerró el capítulo con la sensación de haberse dejado algo dentro. Volvió atrás, releyó, contó los párrafos. No encontró el hueco. Lo dejó así.", "w": 26, "d": ["la crónica"], "s": []}, {"t": "·   ·   ·", "w": 3, "d": [], "s": []}, {"t": "Sobre una mesa hay una bolsa de plástico transparente y, al lado, un inventario escrito a mano: cordones, cinturón, un teléfono, unas monedas contadas. Alguien firma la lista y pide que la firme también quien entrega. En el apartado de objetos de valor no hay nada anotado. La bolsa se guarda en un armario junto a otras bolsas iguales, cada una con su nombre escrito, y el armario se cierra con llave.", "w": 72, "d": [], "s": []}, {"t": "·   ·   ·", "w": 3, "d": [], "s": []}]}, {"n": 10, "t": "LA VÍSPERA", "song": "«El baile de los que sobran» — Los Prisioneros (1986)", "c": "Falta un día.", "fn": "El capítulo más feliz del libro. La lluvia, el campo, el altavoz encendido por fin, los tres cantando. Se escribe FELIZ: la devastación es retroactiva.", "reglas": ["Se escribe ALEGRE. Sin melancolía, sin presagios, sin música triste de fondo.", "AQUÍ se enciende el altavoz por primera vez. Es el pago de todo el libro.", "La lluvia es lo único que toca a los tres. El único abrazo lo da el cielo.", "El hombre del paraguas ve a UN hombre solo. Tres frases: entra, mira, se va.", "Frases largas, encadenadas. Es un plano secuencia."], "k": "DIEZ", "items": [{"t": "Aquella mañana la crónica hizo una cosa que no había hecho en todo el libro: se tumbó bocarriba en mitad del camino, para ver llover desde abajo. Desde abajo la lluvia no cae: sale. Sale de un cielo gordo y bajísimo, gris de tormenta buena, y tarda muchísimo en llegar, y mientras baja se la ve venir, gota a gota, creciendo, eligiendo, hasta que revienta en la frente, en el pecho, en las manos abiertas de tres hombres que corren con la cara levantada. Era una lluvia de calor de finales de octubre, rara, casi impropia, templada como el final de una ducha. No castigaba nada. Apagaba cosas: la fiebre de los sesenta días de cuenta, el polvo del verano largo, el ruido. Ninguno de los tres dijo vamos a resguardarnos, porque hay lluvias que se esquivan y lluvias que se agradecen, y esta era de las segundas.", "w": 148, "d": ["la lluvia", "la crónica"], "s": []}, {"t": "Y por primera vez en esta crónica, se salieron del mapa. El asfalto se acabó sin pedir permiso, la acera se hizo cuneta, la cuneta se hizo tierra, y la ciudad entera —con sus semáforos, sus portales, sus supermercados y sus oficinas— se quedó atrás como se queda atrás un abrigo en abril. Aquí no había nada de lo de siempre. Ni una farola. Ni una esquina con nombre. Solo campo abierto, un camino de tierra oscurecida por el agua, y tres hombres a los que nadie esperaba en ninguna parte hasta mañana.", "w": 93, "d": ["la crónica"], "s": []}, {"t": "Porque para salirse de Madrid corriendo hay que quererlo. No basta con ir hacia fuera: la ciudad se acaba tres o cuatro veces antes de acabarse de verdad. Primero se acaban los bares. Después se acaban las aceras. Después viene un tramo largo de naves con la persiana echada, vallas, y solares con el cartel de una promoción que nunca se construyó, y ahí es donde la mayoría de la gente da media vuelta y lo llama entrenamiento.", "w": 78, "d": [], "s": []}, {"t": "Ellos no dieron la vuelta. Al otro lado había una colina. Nada espectacular: una loma de hierba con cuatro árboles arriba y un camino de tierra rodeándola, de esos que traza alguien andando y años después el ayuntamiento acepta y bordea de cemento. Pero cuando la coronas, Madrid se te queda detrás como una cosa que ya no te está mirando. Y eso, con lluvia templada, las piernas calientes y toda la mañana por delante, es lo más parecido a la libertad que un hombre de treinta y cinco años se puede permitir un martes.", "w": 95, "d": ["la lluvia"], "s": []}, {"t": "Corrían como en los anuncios de zapatillas, así de claro lo dice la crónica y sin ninguna vergüenza, corrían rápido y sin miedo a nada, atacando las cuestas en vez de sufrirlas, saltando los charcos cuando querían lucirse y pisándolos en el centro cuando querían reírse, y el barro salpicaba hasta las rodillas, hasta la espalda, hasta la cara, y nadie paró a limpiarse porque limpiarse era de otra vida, y la crónica los seguía de lado, entre los árboles, como una cámara con las piernas jóvenes, y los perdía detrás de un tronco y los recuperaba más lejos, más rápidos, más felices, tres zancadas distintas sonando a lo mismo, el de la técnica perfecta, el de la elegancia rota, el de la resistencia infinita, uno, dos, tres, uno, dos, tres, sin un solo punto donde pararse a respirar porque esta frase, como esa carrera, no quería terminarse nunca.", "w": 149, "d": ["la crónica"], "s": []}, {"t": "Fue entonces cuando el cielo hizo una cosa de cielo joven. Por un lado seguía negro de tormenta, pero por el otro se rompió y dejó salir el sol de golpe, bajo y oblicuo, y esa luz entró por debajo de la lluvia y la encendió entera: cada gota era de pronto una chispa cayendo, el aire una plata suelta que no se estaba quieta, y los tres corrían a contraluz con los bordes ardiendo. Y justo en la costura entre lo negro y lo encendido, el cielo abrió un arcoíris entero, de suelo a suelo, con los colores bien puestos. Ninguno lo señaló con el dedo, porque señalarlo habría sido pararse, pero los tres torcieron la cabeza al pasar, y la crónica dejó registrado que un arcoíris mirado a la carrera dura más que uno mirado quieto, aunque no pueda demostrarlo.", "w": 142, "d": ["la lluvia", "la crónica"], "s": []}, {"t": "Hacia la mitad del camino pasó una cosa que la crónica no sabe contar sin quedarse corta. El sendero se estrechó entre los árboles y ya no se pudo correr en grupo, y durante un tramo largo cada uno fue completamente solo, sin ver a los otros, cada uno con su lluvia y su respiración y su barro. Y no importó nada. Mejor: fue lo mejor. La alegría, que ya venía alta, subió ahí un escalón que la crónica no conocía, uno que ya no necesita compañía, ni testigos, ni motivo, ni música siquiera, una alegría encantada de sí misma, casi maniática de pura limpia, que se basta y se sobra y canta sola. Ir completamente solo por un bosque mojado y que eso no sea una pena sino una fiesta: eso también se aprende un martes. En una de las cuestas Darío resbaló en el barro, metió el brazo por delante, se levantó de un salto sin mirar dónde había caído y siguió corriendo con la risa puesta. Nadie lo vio. A él le dio igual que nadie lo viera. Se vivía.", "w": 183, "d": ["la lluvia", "la crónica"], "s": []}, {"t": "En mitad del campo, sin anunciarlo, Darío se llevó la mano al bolsillo. Sacó el altavoz —el altavoz pequeño, el del tamaño de una nuez, el que llevaba semanas apagado y presente como llevan algunas cosas los bolsillos— lo miró un segundo bajo la lluvia y pulsó play. Primera música de las mañanas en mucho tiempo. Sonó la de Los Prisioneros. El baile de los que sobran. Y la carrera, que ya era buena, se volvió otra cosa.", "w": 78, "d": ["el altavoz (nuez)", "la lluvia"], "s": []}, {"t": "Cantaron. Los tres, a gritos, desafinando con un orgullo de estadio, cada uno en un tono y los tres en el mismo sitio. Donde no se sabían la letra no pararon: la rellenaron con laralaralá, que es como se canta lo que se ama de memoria y mal. La lluvia los tocaba a los tres a la vez, con la misma mano, sin pedir permiso, y ellos cantaban. Era la primera vez en todo el libro que las tres voces hacían algo juntas, y la crónica, que anota sin permiso, anotó también esto: Darío cantaba. El hombre que parpadea dos veces en vez de llorar iba a pleno pulmón, con la boca abierta a la lluvia, sin guardarse nada, y sonaba fatal, y era —de largo, sin discusión— lo mejor que esta crónica le había oído hacer a nadie.", "w": 139, "d": ["el parpadeo doble", "la lluvia", "la crónica"], "s": []}, {"t": "Al borde del camino había un hombre mayor con paraguas, parado bajo un árbol. Vio pasar a un hombre empapado hasta los huesos, corriendo por el campo y cantando a gritos una canción de hace cuarenta años, feliz como un niño, y sonrió y pensó algo parecido a qué feliz va ese loco. Después siguió su paseo.", "w": 57, "d": [], "s": []}, {"t": "A la vuelta, con la ciudad asomando otra vez al fondo, Ari dijo una cosa rara en él. Dijo: hoy no me habría importado perder. Lo dijo bajito, hacia el camino, como quien suelta una moneda. Nadie lo comentó, porque hay frases que se estropean si se contestan, y la carrera siguió como si nada, que era exactamente lo que la frase necesitaba.", "w": 63, "d": [], "s": []}, {"t": "Río se reía. No la risa de los desconocidos en los bares, no la risa de después de los afters: la de verdad, la primera desde el correo aquel. La lluvia le había deshecho el peinado por completo, el orden entero de la cabeza se le había venido abajo, y con el desorden, la crónica lo vio clarísimo, volvió él. Corría con el pelo pegado a la frente, hecho un desastre soberano, y no se lo tocó ni una vez en todo el camino.", "w": 84, "d": ["la lluvia", "la crónica"], "s": []}, {"t": "Y Darío cantaba todavía. La canción ya había acabado dos veces y él seguía con el laralaralá bajito, al ritmo de la zancada, para que no se le enfriara una cosa que acababa de aprender a hacer.", "w": 37, "d": [], "s": []}, {"t": "En el borde de la ciudad la lluvia amainó como quien termina un trabajo. El altavoz se apagó. Alguien dijo mañana, y nadie añadió nada, porque mañana era la fiesta y sobraban las palabras. Ari levantó los dos dedos. Río hizo el abrazo al aire, hoy más lento que nunca, con los brazos abiertos un segundo de más. Darío asintió. Y cada uno se fue hacia su puerta chorreando, dejando tres regueros de agua que la mañana borró enseguida. La lluvia ya los había abrazado por todos.", "w": 87, "d": ["el saludo de dos dedos", "el abrazo al aire", "el altavoz (nuez)", "la lluvia"], "s": []}, {"t": "Ah, y una anécdota, porque los días buenos también las dejan: en el portal, buscando las llaves, Darío se descubrió una raya roja en el antebrazo. Fina, larga, ya seca. De la cuesta, o de una rama, o del barro con piedras, quién sabe. No recordaba habérsela hecho. No le había dolido en ningún momento, ni entonces ni ahora. La miró con curiosidad de turista, como se mira un souvenir que no recuerdas haber comprado, se bajó la manga y subió a casa. El día había sido tan bueno que el cuerpo no quiso interrumpirlo con noticias.", "w": 97, "d": ["la raya roja"], "s": []}, {"t": "La crónica volvió a casa empapada y silbando. Hay días que se escriben solos. Este se cantó.", "w": 17, "d": ["la crónica"], "s": []}, {"t": "·   ·   ·", "w": 3, "d": [], "s": []}, {"t": "Llueve contra una ventana que no se abre. Alguien, muy quieto, la escucha desde dentro, con la cara vuelta hacia el cristal. Esta noche no hace falta imaginar nada: llueve en los dos mundos a la vez.", "w": 37, "d": [], "s": []}, {"t": "·   ·   ·", "w": 3, "d": [], "s": []}]}, {"n": 11, "t": "LA FIESTA", "song": "«Morir tres veces» — Moenia · «Livin’ la Vida Loca» — Ricky Martin (1999) · «Llueve sobre la ciudad» — Los Bunkers (2005)", "c": "Hoy.", "fn": "Los tres espejos, el baño, el giro. Entra en plural y sale en singular. El asesinato es una conjugación.", "reglas": ["EL GIRO. Entra al baño en plural, sale en singular. Y el plural NO vuelve nunca más.", "La violencia jamás en página. La crónica se queda fuera de la puerta.", "Lo rojo no se confirma ni se niega. Ni instrumento, ni herida descrita.", "Los tres espejos tienen la misma esquina picada. Se menciona UNA vez, de pasada.", "«Pensó: los he matado. Y detrás, sin permiso: por fin.» Tragedia, nunca liberación."], "k": "ONCE", "items": [{"t": "A la mañana siguiente no corrió nadie. Por primera vez en toda esta crónica, nadie corrió. Se habían quedado dormidos, los tres, a la vez, con ese sueño espeso y sin fondo que dejan los días perfectos, y la ciudad amaneció sin ellos y no se dio ni cuenta. En una de las tres casas el teléfono sonaba sin parar. Era la agencia. En la agencia estaban desconcertados, y con razón: en quinientas horas no había faltado ni una, ni con fiebre, ni con Madrid nevada, ni un solo día. Preguntaron entre las mesas, revisaron el correo, volvieron a llamar. El teléfono sonó hasta cansarse en un piso con las persianas bajadas, donde alguien dormía como se duerme una sola vez por vida. La constitución decía que se habla corriendo o no se habla. Aquella mañana no se corrió. Aquella mañana, ya, no se habló.", "w": 145, "d": ["la crónica"], "s": []}, {"t": "La tarde llegó como llegan las tardes de los días grandes: de golpe y sin avisar, con la luz ya naranja en las persianas. Y en tres cuartos de baño de tres casas distintas empezó a sonar la misma canción. Una de Moenia. Una que se llama «Morir tres veces». Sonando en tres baños a la vez, la víspera de nada, porque ya no era la víspera: era el día. A nadie le extrañó. A la crónica tampoco, y eso es lo que más le va a costar perdonarse.", "w": 89, "d": ["la crónica"], "s": []}, {"t": "Espejo uno. Ari. El peine primero, el producto después, mechón a mechón, con el método de quien construye un edificio que tiene que aguantar una sola noche. La pintura blanca aplicada por capas finas, con pulso de profesional del retoque, sin mancharse el cuello de la camisa. En el mentón, la tirita de hace semanas: se la despegó despacio, se miró el corte tan de cerca que se le veía el poro y el nacimiento del pelo perlado de sudor bajo la pintura, y decidió no ponerse otra. Un conde puede permitirse una cicatriz. Un conde, pensó, casi debería.", "w": 99, "d": ["la tirita"], "s": []}, {"t": "Espejo dos. Río. Y aquí la crónica va a ir despacio, porque lo fácil sería hacer un chiste y Río se merece la verdad. La verdad es esta: el hombre más querido de todas las fiestas de Madrid no puede entrar a una habitación llena de gente siendo solamente él. Hace años que no puede. Tantos que ya no se acuerda de la primera vez, y eso es lo peor de todo, que el miedo ya no tiene fecha de compra. Para las habitaciones llenas de gente existe una llave, y Río la llevaba en el bolsillo. La llave no lo pone contento. Lo hace posible. Es valor de alquiler, con hora de devolución, y él lo sabe mejor que nadie porque lleva media vida devolviéndolo. No la lleva para disfrutar de la fiesta. La lleva para poder ser la versión de él que la gente invita. La mano bajó a comprobar el bolsillo. Subió. Volvió a bajar, a comprobarlo otra vez. La vergüenza pequeña de siempre, y encima de la vergüenza, el maquillaje: la pintura blanca a medio hacer, que con él tenía la mitad del trabajo ya adelantado, porque las ojeras las traía puestas. Y entonces hizo lo que la crónica no habría querido ver: en voz baja, delante del espejo, ensayó dos anécdotas. Dos. Con sus pausas y sus remates, corrigiendo un adjetivo, mejorando el final. El hombre más espontáneo de cada fiesta lleva la espontaneidad preparada de casa. Su gracia es trabajo. Su ligereza es oficio. La persona más querida de cada fiesta es, a veces, la que más caro paga la entrada. Y la paga sola.", "w": 271, "d": ["la crónica"], "s": []}, {"t": "Espejo tres. Darío. Espejo pequeño, luz mala, la capa cosida cayendo perfecta, que es lo que tiene la alta costura de contenedor: nadie sabe lo que vale. En la repisa, monedas en columnitas. En el móvil, la ruta a la fiesta abierta en el mapa: comparó el transporte contra caminar, hizo la cuenta que hace siempre, decidió andar los últimos kilómetros. El billete de vuelta quedó sin resolver. Lo dejó sin resolver a propósito, que en su idioma es un acto de fe. Se bajó la manga hasta la muñeca sin mirarse el brazo, porque no había nada que mirar: lo de ayer era una anécdota, y las anécdotas no se miran, se cuentan.", "w": 114, "d": [], "s": []}, {"t": "Y luego los cortes se hicieron cortos. Ari ensayó la sonrisa en el espejo: la primera no le salió; la segunda sí. Río respiró hondo con las dos anécdotas ya sabidas y la mano quieta por fin fuera del bolsillo. Darío se subió el cuello de la capa. Ari apagó la luz. Río apagó la luz. Darío apagó la luz, y en el último reflejo, un detalle sin importancia que la crónica anota por anotar: el espejo tenía una esquina picada, abajo a la derecha, igual que los otros dos. Cosas de los pisos viejos. A la misma hora exacta, en tres baños de tres casas, tres hombres terminados se miraron a los ojos. Lo que les devolvieron los espejos no se va a describir aquí. Corte a la calle. Corte a la noche. Corte a la fiesta.", "w": 138, "d": ["la esquina picada", "la crónica"], "s": ["por fin"]}, {"t": "La fiesta era en la propia agencia, en la planta de abajo, la que habían vaciado de mesas para la ocasión: un espacio enorme de techo negro y columnas pintadas, con los focos de trabajo encendidos a media potencia y unas bombillas rojas colgadas por encima que no llegaban a mandar. Algún foco magenta. Telarañas de mentira en las esquinas y un esqueleto de plástico colgado de una viga, con una copa atada a la mano. Era una luz que ya no informaba de nada: saturaba las caras hasta borrarles el filo, los contornos se derramaban unos sobre otros y de lejos no se sabía dónde terminaba uno y empezaba el de al lado. Llegaron por separado, con minutos de diferencia, como llegan los que comparten rutina y no dirección, y el sitio se los tragó a los tres sin presentarlos. Sonaba la de Ricky Martin. La de la vida loca. Sonaba, y cuando terminaba, alguien la volvía a poner, y cuando terminaba, alguien la volvía a poner, y a la tercera vez ya nadie sabía si era la tercera vez o si era siempre la misma y la noche había dejado de avanzar.", "w": 194, "d": [], "s": []}, {"t": "Y la primera cosa que vio la crónica, antes que ninguna otra, fue esta: la mitad de la gente no se había disfrazado. Habían bajado de sus mesas con la ropa del trabajo, con la tarjeta todavía colgada del cuello, con el mismo jersey de por la mañana, y estaban allí con su vaso de plástico, pasándoselo perfectamente bien. Entre ellos, sueltas, una bruja, un pirata, unas orejas de diablo compradas a última hora en un bazar. Nadie había contado los días. Nadie llevaba sesenta días pensando en esto. Y la crónica, que sí los había contado uno por uno, tuvo que apoyarse un momento en una columna.", "w": 108, "d": ["la crónica"], "s": []}, {"t": "Bailaron. Eso la crónica lo puede jurar: bailaron, y les fue bien, cada uno en su esquina del mundo. A Ari lo paró un desconocido para decirle que su disfraz era elegantísimo, y Ari contestó con una inclinación de cabeza de conde auténtico. A Río una chica le pidió fuego, y Río contó una anécdota, la primera, y la chica se rio tanto que Río guardó la segunda para más tarde, como un rico. A Darío nadie lo paró, y anduvo la fiesta entera con su vaso lleno sin beber, mirando el baile desde el borde, que es el sitio de los que llegan andando. Hacía calor. Cada vez más calor. La canción volvió a empezar. La crónica quiso mirar el reloj y no encontró ninguno, y las frases, esto lo nota ahora, las frases de esta parte le salen más cortas que de costumbre, como si le faltara el aire, la canción volvió a empezar, hacía calor, la canción volvió a empezar.", "w": 163, "d": ["la crónica"], "s": []}, {"t": "Uno de los tres entró al baño. La crónica no sabría decir cuál, y eso que los conoce de toda la vida. La fiesta estaba oscura, la canción sonaba otra vez, y por el pasillo pasó una capa negra entre hombros ajenos y se metió en el baño y cerró. La crónica fue detrás, como ha ido detrás de todo durante once capítulos, a todas las cocinas, a todos los amaneceres, a todos los cuartos, y por primera vez en este libro no pudo pasar. La puerta estaba cerrada. La crónica se quedó fuera, esperando como un perro. Se oía agua correr. Nada más: agua. En algún momento alguien llamó con los nudillos, y una voz —una voz— contestó: ocupado.", "w": 120, "d": ["la crónica"], "s": []}, {"t": "Salió compuesto. Con la pintura en su sitio y la capa recta, saludó con dos dedos a alguien que le sonó de algo, cruzó dos frases sobre lo llena que estaba la casa, cogió un vaso que no llegó a beberse. El ritual entero de una fiesta, ejecutado sin un fallo. Y después dejó el vaso en una repisa, con cuidado de invitado educado, y volvió a entrar al baño, a ocuparse de lo que había dejado en proceso.", "w": 79, "d": ["el saludo de dos dedos"], "s": []}, {"t": "El agua otra vez. La puerta otra vez. La crónica otra vez fuera, sentada en su propio miedo, contando bombillas rojas para no pensar, y la canción de la vida loca empezando de nuevo en el salón como si el mundo fuera un sitio normal.", "w": 45, "d": ["la crónica"], "s": []}, {"t": "La segunda vez salió distinto. Salió goteando. La pintura blanca barata se le derretía por la cara en regueros grises, y por el pecho de la camisa, atravesando el blanco, había algo rojo. ¿Vino? ¿Pintura? La crónica no lo preguntó y nadie lo preguntó, porque la fiesta hizo lo que hacen las fiestas de Halloween cuando ven a un hombre deshecho: lo felicitó. El mejor disfraz de la noche, le dijo uno levantando su copa. La sangre parece de verdad, le dijo otra tocándose el cuello, encantada. Tenemos ganador, gritó alguien desde la cocina, y nadie organizó nada, porque las fiestas no organizan nada. Hubo aplausos sueltos, de esos de borrachera buena, y un flash: alguien le hizo una foto. Una. Con la boca entreabierta y los ojos en ninguna parte, el Drácula más real que ninguno de los presentes vería en su vida. Cuanto más roto estaba, mejor disfrazado lo veían. Nadie en esa casa notó ninguna ausencia. Nadie preguntó por nadie. No faltaba nadie en ninguna parte, y eso, que era lo único verdaderamente monstruoso de la noche, no lo notó ni la crónica.", "w": 186, "d": ["la crónica"], "s": []}, {"t": "Se fue sin despedirse, que es la única manera de irse de los sitios en llamas. La madrugada del treinta y uno lo recibió disfrazada entera: Madrid llena de brujas fumando en los portales, de momias esperando taxis, de diablos comiendo pizza en las aceras. La única noche del año en que un Drácula con el pecho ensangrentado corriendo a gritos por el centro no es una emergencia: es un triunfo. Un grupo lo vitoreó al pasar. Otro le coreó algo. Uno intentó chocarle la mano y se quedó con la mano en el aire, riéndose igual. La ciudad entera le celebraba lo que la ciudad entera no podía ver.", "w": 110, "d": [], "s": []}, {"t": "Y entonces el cielo se abrió. No como ayer: ayer fue la bendición y esto era el juicio. Un diluvio vertical, brutal, de esos que doblan los paraguas, y la crónica echó a correr detrás de él por el centro vaciándose, entre disfraces huyendo a los portales, y ya no lo perdía detrás de ningún tronco porque ya no había árboles ni había nadie, solo él, corriendo como corría en el campo pero al revés, con la misma zancada infinita y ninguna alegría, cuesta abajo por calles con nombre de reyes, las farolas reventando en estrellas de agua cada vez que las cruzaba y Madrid entero deshecho en manchas de luz, y al pasar por la puerta de un bar salió una canción, la de Los Bunkers, la que dice en el título lo que estaba pasando, «Llueve sobre la ciudad», y la canción salió del bar y ya no volvió a entrar: se quedó con él, sonando, y la crónica admite aquí por primera vez en todo el libro que la música no sonaba en ninguna parte. Sonaba dentro.", "w": 180, "d": ["la crónica"], "s": []}, {"t": "La lluvia le lavó la cara de blanco. Le lavó el pecho de rojo. Se llevó por las alcantarillas de Madrid toda la pintura y todo lo otro, sin preguntar cuál era cuál, y esa fue toda la investigación que hubo y la única que habrá. Corría y pensó: los he matado. Y detrás, sin permiso, pegado a esa frase como el trueno al rayo, llegó lo otro: por fin. La crónica escribe las dos cosas porque las dos sonaron, y pide que se lean como lo que fueron: la primera, un espanto. La segunda, un espanto peor. Y detrás de las dos, empapada, absurda, con la voz de la fiesta y el eco del aplauso, una tercera, la más pequeña, la más triste de todo el libro: había ganado.", "w": 130, "d": ["la lluvia", "la crónica"], "s": ["los he matado", "por fin"]}, {"t": "La carrera no terminó en ningún sitio, porque no iba a ningún sitio. Terminó donde llevaban todo el libro esperándolo. En una calle cualquiera había luces girando despacio, azules y blancas, sin sirena, pintando la lluvia. Unas puertas se abrieron. La ciudad, que lo había vitoreado, lo entregó sin ruido, como se entrega lo que ya no se puede sostener. Las luces lo lavaron de blanco una vez más, la última. Y aquí la crónica corta, porque lo que viene ya no se cuenta corriendo.", "w": 85, "d": ["la lluvia", "la crónica"], "s": []}, {"t": "·   ·   ·", "w": 3, "d": [], "s": []}, {"t": "Las luces de emergencia no llevan sirena. Giran despacio sobre la lluvia, pintando de azul y de blanco a la gente que se aparta en una acera. Alguien muy quieto, empapado hasta los huesos, se deja llevar sin resistirse, con la docilidad de quien por fin ha terminado un trabajo larguísimo. Este fragmento no viene del después. Es ahora. Todos los demás llevaban todo el libro esperándolo aquí.", "w": 68, "d": ["la lluvia"], "s": ["por fin"]}, {"t": "·   ·   ·", "w": 3, "d": [], "s": []}]}, {"n": 12, "t": "EL SUPERVIVIENTE", "song": "«Me quedaré solo» — Amistades Peligrosas (1991) · reprise", "c": "Día uno.", "fn": "El hospital. La sábana, la voz, el ingreso de noche. El llanto por la gata. Y el «yo» por primera vez en todo el libro.", "reglas": ["AQUÍ y solo aquí: «verde agua» y «Osaka».", "Llora por la gata, no por los muertos. Por ahí vuelve la cordura.", "El parte no registra ninguna herida. Cuerpo intacto.", "La tercera persona se rinde a la primera en la última página.", "«Se hizo tres para no cenar solo.» No tocar esa frase."], "k": "DOCE", "items": [{"t": "Lo primero no fue un pensamiento. Fue una textura, dos en realidad: debajo, una sábana suave, lavada mil veces, de esas que ya no abrigan pero acompañan; encima, otra rígida, tiesa de tanto hervir, que no era suya. Entre las dos, un cuerpo que a esta crónica le costó reconocer, porque llevaba doce capítulos sin mirarlo de frente. El techo estaba quieto. Eso lo notó enseguida, sin saber por qué le importaba: el techo estaba quieto, y en algún recuerdo con luz de correa el techo se movía, contaba hacia atrás desde tres, alguien decía tranquilo. Ahora no. Ahora una lámpara larga zumbaba muy bajito, con esa luz de nevera de los sitios donde las ventanas no abren.", "w": 118, "d": ["la crónica"], "s": []}, {"t": "El brazo derecho le tiraba un poco. Se lo miró. Una raya roja, fina, ya con costra, cruzándole el antebrazo, y no le dolía, y no recordaba habérsela hecho, aunque esta vez la crónica sí lo recordaba, la recordaba perfectamente, era del barro, de la cuesta, del día bueno, pero eso ya no se lo podía decir, porque la crónica y él, aquella mañana, habían dejado de ser exactamente la misma voz. Se buscó la muñeca izquierda con la mano, por costumbre, buscando un reloj que le medía hasta las intenciones, y no había reloj. Se pasó la mano por el pelo, buscando un orden que defender, y el pelo estaba aplastado, rendido, sin nada que defender. Los gestos le salían todos, uno detrás de otro, el de arreglarse el pelo y el de mirar la hora y el de contar por lo bajo, todos a la vez en un solo cuerpo, como tres juegos de llaves guardados en el mismo bolsillo.", "w": 162, "d": ["la raya roja", "la crónica"], "s": []}, {"t": "Llevaba puesto un pijama que no era suyo, de un color que esta crónica, que ha nombrado el gris de los amaneceres y el blanco barato de la pintura y el rojo que no se supo, no había pronunciado ni una sola vez en todo el libro, y lo pronuncia ahora porque ya no queda nada que proteger: verde agua. Un verde de agua quieta, de piscina en invierno, de bata lavada hasta la ternura. No lo había elegido él; se lo habían puesto. Y aun así, mirándoselo en el pecho y en las rodillas, sintió una cosa impropia de aquella mañana, algo parecido a estar en casa, y no supo de qué le sonaba aquel color. La crónica sí lo sabía. Y por primera vez en todo el libro se calló una cosa por piedad, y no por regla.", "w": 140, "d": ["⚠ VERDE AGUA (solo cap.12)", "la crónica"], "s": []}, {"t": "Lo que hizo a continuación no lo entiende nadie que no haya estado, y por eso la crónica lo escribe sin adornarlo: se tapó con la sábana hasta arriba y no salió. No un rato. Un día entero, o más. El tiempo ahí dentro no se cuenta con reloj sino con comidas, y él no contó las comidas. Debajo de una sábana no se está a salvo, pero se está menos a la intemperie, y a esas alturas era la única diferencia que podía permitirse.", "w": 85, "d": ["la crónica"], "s": []}, {"t": "Y estaba la voz. Muy cerca, a una cama o dos, una voz que repetía siempre lo mismo sin cansarse nunca: auxilio, auxilio, se quema, se quema. No como se grita una cosa una vez: como gira un disco rayado, el mismo surco, la misma entonación exacta, durante horas. Se durmió con esa frase y se despertó con esa frase, y llegó a pensar que se había despertado dentro de la misma sílaba. Y en algún momento —esto es lo peor de todo y aun así lo apunta— dejó de darle miedo y empezó a hacerle compañía.", "w": 97, "d": [], "s": []}, {"t": "Una noche hubo gritos y gente corriendo. Un ingreso. Los pasos venían hacia su lado y él no llegó a distinguir casi nada: un grupo de personas empujando, intentando sujetar la fuerza abrumadora de alguien que llegaba en una camilla, atado con fajas anchas por todo el cuerpo, con algo puesto en la cara para que no mordiera. Fue un segundo. Puede que dos. Después la crónica se cae. No hay más apunte de esa noche porque el que escribía se desmayó, y hasta una crónica tiene un límite: ese fue el suyo.", "w": 93, "d": ["la crónica"], "s": ["hasta una crónica tiene un límite"]}, {"t": "Cuando por fin sacó la cabeza de debajo de la sábana era otra vez de día y la habitación estaba tranquila, como si nada de aquello hubiera pasado nunca, que es exactamente el efecto que tienen las mañanas.", "w": 38, "d": [], "s": ["por fin"]}, {"t": "Entró una mujer empujando un carro, con una sonrisa entrenada en ser amable. Buenos días, dijo, ¿cómo se encuentra? Y él, que llevaba una novela entera contestando muy bien, rápido, para que la frase no tuviera dónde apoyarse, esta vez tardó. Miró a un lado y a otro de la habitación. Buscó. ¿Y los otros?, preguntó. La mujer dejó de empujar el carro. ¿Los otros? Los que venían conmigo, dijo él, éramos… y ahí la frase se le cayó al suelo, porque para terminarla hacía falta un número y el número no vino. La mujer lo miró con la pena serena de quien ya ha visto esto otras veces. Vino usted solo, cariño, dijo. Lo trajeron anoche. Vino usted solo.", "w": 120, "d": [], "s": []}, {"t": "Dijo los nombres. Los dijo en voz alta, con su propia boca, por primera vez en el libro, porque durante doce capítulos los nombres los había puesto la crónica y nunca él. Ari, dijo. Y Río. Y al oírlos sonar fuera de su cabeza, pequeños, planos, dos palabras cualesquiera en una habitación con luz de nevera, algo se movió muy hondo, algo que no llegó a ser pensamiento porque el pensamiento habría dolido demasiado y el cuerpo, que es más piadoso que la cabeza, lo paró antes de tiempo. La mujer no conocía esos nombres. Nadie en aquel sitio los conocía. No constaban en ninguna lista, no habían ingresado, no aparecían en el parte de ninguna noche. Habían corrido cuarenta y seis mañanas por Madrid y no habían dejado ni una sola huella, porque las huellas eran todas del mismo pie.", "w": 141, "d": ["la crónica"], "s": []}, {"t": "Y entonces preguntó por lo único por lo que de verdad necesitaba preguntar: la única cosa viva que lo esperaba en el mundo, la que sabía cómo respiraba cuando no había nadie mirando. Preguntó por la gata. ¿Quién le está dando de comer a Osaka?, dijo, y por primera vez en toda la mañana hubo urgencia en su voz, una urgencia limpia, cuerda, la más cuerda de todo el libro, porque de todas las cosas que aquella noche se habían deshecho, aquella —una gata pequeña esperando en un piso vacío— era de verdad, seguía viva, y había que darle de comer. La mujer del carro sonrió, esta vez de verdad. Está atendida, le dijo. La persona que lo trajo anoche tiene las llaves de su casa. La gata está bien, come, lo espera.", "w": 133, "d": ["la gata", "⚠ OSAKA (solo cap.12)"], "s": []}, {"t": "Y entonces pasó lo que no había pasado en todo el libro. El hombre que solo sabía parpadear dos veces, el que llevaba doce capítulos llorando sin una sola lágrima, se echó a llorar de verdad. A mares, sin poder parar, sin querer parar, con un llanto de cuerpo entero que no era por los dos que ya no estaban, ni por la fiesta, ni por la lluvia: era por la gata. Solo por la gata. Y mientras lloraba se acordó de golpe de que ya lloraba por ella antes, la noche anterior, en el suelo de su propia casa, mucho antes de que las luces sin sirena vinieran a buscarlo —que de toda aquella noche rota, lo último verdadero, lo único que se había salvado entero, había sido eso: él en el suelo, sin poder respirar, sin poder parar de llorar por una gata pequeña que lo miraba sin entender nada. Resulta que la cordura, cuando decidió volver, no volvió por la puerta grande. Volvió por ahí. Por el sitio más blando. Por lo único que en toda la historia había sido siempre, sin una sola grieta, verdad.", "w": 189, "d": ["el parpadeo doble", "la gata", "la lluvia"], "s": []}, {"t": "Cuando por fin paró de llorar, la habitación se había vuelto otra. Por primera vez en todo el libro lo vio todo a la vez y todo nítido —la mujer, el carro, sus propias manos, la ventana—, sin nada disolviéndose en el fondo, sin un solo borde temblando. Y entraba luz de día. Una luz blanca, limpia, de mañana de verdad, la primera del libro que no salía de ninguna lámpara: se colaba por la ventana que todavía no abría y lo dejaba todo igual de claro, lo de cerca y lo de lejos, sin obligarlo a elegir dónde mirar. Así se ve el mundo cuando uno deja de tener que inventárselo: entero, un poco aburrido, verdadero. Y dolía muchísimo menos de lo que había temido.", "w": 126, "d": [], "s": ["por fin"]}, {"t": "Se hizo tres para no cenar solo. Para tener con quién correr, para que alguien le pusiera una canción por las mañanas. Les puso nombres y los quiso de verdad, y corrió con ellos cada amanecer hasta que la ciudad se quedó sin esquinas donde esconder que iba solo. Menos mal que quedaba la gata. A la gata no se la inventó. Y por eso, de todo lo que preguntó aquella mañana, la gata fue lo único que le contestaron que sí.", "w": 82, "d": ["la gata"], "s": ["Se hizo tres para no cenar solo"]}, {"t": "Alguien había estado con él toda la noche. Alguien con llaves de su casa, que entró en un piso a oscuras —el wifi desconectado, media bombilla desenroscada, un cuchillo absurdo en la mesilla que no había hecho daño a nadie más que al propio miedo— y se ocupó de lo que había que ocuparse, y le puso comida a la gata, y después lo llevó a Urgencias y no le soltó la mano en toda la noche. La crónica no lo va a nombrar, porque hay nombres que no son de este libro sino del siguiente. Solo dirá que existía, que era de carne y hueso, que fue el único que estuvo de verdad, y que cuando de madrugada alguien preguntó en un mostrador si había venido solo, la respuesta más difícil de todo el expediente resultó ser también la más piadosa: no. Esa noche, no. Vino con la única persona que le quedaba.", "w": 154, "d": ["la gata", "la crónica"], "s": []}, {"t": "Le preguntaron si quería avisar a alguien. Dijo que no hacía falta, y después se quedó un rato largo haciendo la cuenta de siempre: la diferencia horaria —allá era de madrugada—, lo que cuesta un billete comprado con prisa, lo que tarda en llegar alguien que sale corriendo desde el otro lado del mundo. Le salió que no. Siempre le salía que no.", "w": 63, "d": [], "s": []}, {"t": "A ocho mil kilómetros había una mujer durmiendo que no sabía nada. Si lo hubiera sabido habría cogido un avión ese mismo día, sin preguntar cuánto costaba, y era exactamente eso lo que él no podía permitirse: que alguien gastara así por él. Le había escrito siempre que había estado mal, desde los dieciocho años, desde el primer invierno solo. Aquella mañana no le escribió. Fue la única vez.", "w": 69, "d": [], "s": ["Fue la única vez"]}, {"t": "El parte de aquella noche fue escueto, como son los partes. Registró a un varón. Registró una erosión superficial en el antebrazo derecho, compatible con una caída practicando deporte. No registró ninguna otra herida. Ni una. Ni cuchillo, ni cristal, ni la sangre de nadie, porque no había sangre de nadie: la única sangre real de todo el libro había sido la suya, y venía del día más feliz de su vida. Ari no tenía cuerpo que llevar a ningún sitio. Río tampoco. No hubo dos muertos en el baño de ninguna fiesta. Lo único que se apuñaló aquella noche fue una certeza, y las certezas no dejan marca en la piel, y esa es la verdad más difícil de todas: el golpe fue absoluto y no dejó ni un rasguño que curar. Solo una rayita de haberse caído en el barro, un día, riendo.", "w": 145, "d": [], "s": []}, {"t": "En este libro el contador no hizo otra cosa que bajar desde la primera página. Cuarenta y seis. Cuarenta y dos. Hasta hoy, que ya no era víspera de nada y ya no restaba nada. Alguien de enfermería anotó la fecha en una tabla y, sin darse cuenta, empezó a contar hacia el otro lado. Ya no faltaban días. Empezaban. Día uno.", "w": 62, "d": [], "s": []}, {"t": "Y aquí la crónica se rinde, porque la crónica solo sabía contar hacia atrás, y a partir de mañana toca aprender el otro sentido, el difícil, el de ir sumando. Lo que viene ya no cabe en este libro: una ventana de color verde agua que un día de estos alg
