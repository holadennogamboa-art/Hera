let ci=0,pi=0,dir=null;
const K='taller-gde';
let mine=JSON.parse(localStorage.getItem(K)||'{}');
document.getElementById('rls').innerHTML=D.reglas.map(r=>'<li>'+r+'</li>').join('');
const id=(c,p)=>'c'+D.caps[c].n+'p'+p;
const txt=(c,p)=>(mine[id(c,p)]||'');
const done=(c,p)=>txt(c,p).trim().length>40;

function pintarCaps(){
 document.getElementById('caps').innerHTML=D.caps.map((c,i)=>{
  const t=c.items.length,d=c.items.filter((_,j)=>done(i,j)).length;
  return '<button class="cap'+(i===ci?' on':'')+'" onclick="irCap('+i+')"><b>'+c.n+'. '+c.t+'</b>'+
   '<span>'+d+' de '+t+'</span><div class="mini"><i style="width:'+(d/t*100)+'%"></i></div></button>';
 }).join('');
 const T=D.caps.reduce((a,c)=>a+c.items.length,0);
 const Dn=D.caps.reduce((a,c,i)=>a+c.items.filter((_,j)=>done(i,j)).length,0);
 document.getElementById('gb').style.width=(Dn/T*100)+'%';
 document.getElementById('gp').textContent=Dn+' / '+T;
}
function pintar(){
 const c=D.caps[ci],it=c.items[pi];
 document.getElementById('head').innerHTML='<h2>Capítulo '+c.n+' — '+c.t+'</h2>'+
  '<p class="song">'+c.song+'</p><p class="cnt">'+c.c+'</p><p class="fn">'+c.fn+'</p>'+
  '<details open><summary>Reglas de este capítulo</summary><ul>'+c.reglas.map(r=>'<li>'+r+'</li>').join('')+'</ul></details>';
 document.getElementById('pos').textContent='Párrafo '+(pi+1)+' de '+c.items.length;
 document.getElementById('dots').innerHTML=c.items.map((_,j)=>
  '<button class="dot'+(done(ci,j)?' done':'')+(j===pi?' now':'')+'" onclick="irP('+j+')"></button>').join('');
 document.getElementById('ref').textContent=it.t;
 document.getElementById('rw').textContent=it.w+' palabras';
 document.getElementById('tags').innerHTML=
  it.s.map(s=>'<span class="tag s">no toques: «'+s+'»</span>').join('')+
  it.d.map(d=>'<span class="tag">'+d+'</span>').join('');
 const ta=document.getElementById('ta');ta.value=txt(ci,pi);cw();
 pintarCaps();
}
function cw(){const n=document.getElementById('ta').value.trim().split(/\s+/).filter(Boolean).length;
 document.getElementById('mw').textContent=n+' palabras';}
document.getElementById('ta').addEventListener('input',e=>{
 mine[id(ci,pi)]=e.target.value;localStorage.setItem(K,JSON.stringify(mine));cw();
 document.getElementById('st').textContent='guardado '+new Date().toLocaleTimeString('es-ES');
 clearTimeout(window._t);window._t=setTimeout(guardarFS,1500);
});
function irCap(i){ci=i;pi=0;pintar();scrollTo(0,0)}
function irP(j){pi=j;pintar()}
function mov(d){const c=D.caps[ci];let p=pi+d;
 if(p<0){if(ci>0){ci--;p=D.caps[ci].items.length-1}else p=0}
 else if(p>=c.items.length){if(ci<D.caps.length-1){ci++;p=0}else p=c.items.length-1}
 pi=p;pintar();scrollTo(0,0)}
function hecho(){mov(1)}
addEventListener('keydown',e=>{if(e.target.tagName==='TEXTAREA')return;
 if(e.key==='ArrowLeft')mov(-1);if(e.key==='ArrowRight')mov(1)});

async function conectar(){
 if(!window.showDirectoryPicker){alert('Tu navegador no permite esto. Usa Chrome en el Mac, o el botón «Exportar capítulo».');return}
 try{dir=await showDirectoryPicker({mode:'readwrite'});
  document.getElementById('fsb').textContent='Carpeta conectada ✓';
  document.getElementById('st').textContent='guardando en tu carpeta';guardarFS();
 }catch(_){}
}
async function guardarFS(){
 if(!dir)return;
 try{for(const c of D.caps){
   const l=c.items.map((it,j)=>txt(D.caps.indexOf(c),j)).filter(t=>t.trim());
   if(!l.length)continue;
   const f=await dir.getFileHandle('cap'+String(c.n).padStart(2,'0')+'-'+c.t.toLowerCase().replace(/ /g,'-')+'.md',{create:true});
   const w=await f.createWritable();
   await w.write('# Capítulo '+c.n+' — '+c.t+'\n\n'+c.song+'\n\n'+c.c+'\n\n'+l.join('\n\n')+'\n');
   await w.close();}
  document.getElementById('st').textContent='guardado en tu carpeta · '+new Date().toLocaleTimeString('es-ES');
 }catch(e){document.getElementById('st').textContent='no pude escribir en la carpeta'}
}
function exportar(){
 const c=D.caps[ci];
 const l=c.items.map((it,j)=>txt(ci,j)).filter(t=>t.trim());
 const b='# Capítulo '+c.n+' — '+c.t+'\n\n'+c.song+'\n\n'+c.c+'\n\n'+l.join('\n\n')+'\n';
 const a=document.createElement('a');
 a.href=URL.createObjectURL(new Blob([b],{type:'text/markdown'}));
 a.download='cap'+String(c.n).padStart(2,'0')+'-'+c.t.toLowerCase().replace(/ /g,'-')+'.md';a.click();
}
pintar();
</script></body></html>
