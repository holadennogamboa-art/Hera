<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EYEHERA">
<meta name="theme-color" content="#0a0a0a">
<title>EYEHERA Control</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a0a;color:#f2f2f2;font-family:system-ui,sans-serif;font-size:16px;padding:20px 0 100px 0;overflow-y:scroll;-webkit-user-select:none}h1{font-size:28px;margin:20px 20px 5px;font-weight:700}.sub{color:#8a8a8a;font-size:11px;margin:0 20px 20px;letter-spacing:1px}.card{background:#141414;border:1px solid #262626;border-radius:12px;margin:12px 20px;padding:16px}.stat{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #262626}.stat:last-child{border:0}.stat b{font-size:20px}.btn{width:calc(100% - 40px);margin:8px 20px;padding:14px;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;background:#262626;color:#f2f2f2}.btn-gold{background:#c9a96a;color:#1a1408}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:999}.modal.open{display:flex;flex-direction:column;justify-content:flex-end}.modal-inner{background:#141414;border-radius:20px 20px 0 0;padding:20px;max-height:85vh;overflow-y:auto}h2{margin-bottom:15px}label{display:block;font-size:12px;color:#8a8a8a;margin:12px 0 5px;text-transform:uppercase;letter-spacing:.1em}input,select{width:100%;padding:12px;margin:6px 0;background:#1c1c1c;border:1px solid #262626;color:#f2f2f2;border-radius:8px;font-family:inherit;font-size:16px}.tab{display:none;padding:0 20px}.tab.active{display:block}.section{font-size:12px;color:#8a8a8a;text-transform:uppercase;letter-spacing:.08em;margin:20px 0 10px;font-weight:600}.item{padding:10px 0;border-bottom:1px solid #262626;display:flex;justify-content:space-between;align-items:center}.item:last-child{border:0}.item-text{flex:1}.item-title{font-weight:600}.item-sub{font-size:12px;color:#8a8a8a;margin-top:2px}.btn-x{background:0;border:0;color:#e06a5c;font-size:18px;cursor:pointer;padding:4px}nav{position:fixed;bottom:0;left:0;right:0;background:#0a0a0a;border-top:1px solid #262626;display:flex;width:100%}.nav-btn{flex:1;padding:10px 0;background:0;border:0;color:#8a8a8a;font-size:11px;cursor:pointer}.nav-btn.active{color:#c9a96a}.empty{text-align:center;color:#5a5a5a;padding:30px 20px}.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#c9a96a;color:#1a1408;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none}.toast.show{opacity:1}</style>
</head>
<body>
<h1>👁 EYEHERA</h1>
<div class="sub">Control Center</div>

<div id="tab-0" class="tab active">
<div class="card">
<div class="stat"><span>Seguidores</span><b id="f">0</b></div>
<div class="stat"><span>Vistas</span><b id="v">0</b></div>
<div class="stat"><span>Engagement</span><b id="e">0%</b></div>
</div>
<button class="btn btn-gold" onclick="openM('log')">+ Registrar día</button>
<button class="btn" onclick="openM('post')">+ Nuevo post</button>
<button class="btn" onclick="openM('creator')">+ Creador</button>
</div>

<div id="tab-1" class="tab">
<div class="section">Historial</div>
<div class="card" id="logs"><div class="empty">Sin registros</div></div>
</div>

<div id="tab-2" class="tab">
<div class="section">Posts</div>
<div class="card" id="posts"><div class="empty">Sin posts</div></div>
</div>

<div id="tab-3" class="tab">
<div class="section">Creadores <span id="cc">0</span>/100</div>
<div class="card" id="creators"><div class="empty">Sin creadores</div></div>
</div>

<div id="tab-4" class="tab">
<div class="card">
<button class="btn" onclick="exp()">⬇ Exportar</button>
<button class="btn" onclick="document.getElementById('imp').click()">⬆ Importar</button>
<input type="file" id="imp" accept=".json" onchange="imp(event)" style="display:none">
<button class="btn btn-gold" onclick="seed()">✦ Datos iniciales</button>
</div>
</div>

<nav>
<button class="nav-btn active" onclick="tab(0)">Hoy</button>
<button class="nav-btn" onclick="tab(1)">Tracker</button>
<button class="nav-btn" onclick="tab(2)">Posts</button>
<button class="nav-btn" onclick="tab(3)">Creators</button>
<button class="nav-btn" onclick="tab(4)">Datos</button>
</nav>

<div id="log" class="modal"><div class="modal-inner"><h2>Registrar día</h2><label>Fecha</label><input type="date" id="ld"><label>Seguidores</label><input type="number" id="lf"><label>Vistas</label><input type="number" id="lv"><label>Engagement %</label><input type="number" step="0.1" id="le"><button class="btn btn-gold" onclick="saveLog()">Guardar</button><button class="btn" onclick="closeM('log')">Cancelar</button></div></div>

<div id="post" class="modal"><div class="modal-inner"><h2>Nuevo post</h2><label>Título</label><input id="pt"><label>Tipo</label><select id="pty"><option>Reel</option><option>Imagen</option><option>Carrusel</option></select><label>Vistas</label><input type="number" id="pv"><button class="btn btn-gold" onclick="savePost()">Guardar</button><button class="btn" onclick="closeM('post')">Cancelar</button></div></div>

<div id="creator" class="modal"><div class="modal-inner"><h2>Creador</h2><label>@usuario</label><input id="ch"><label>Nicho</label><select id="cn"><option>Fotógrafo</option><option>Curador</option><option>Cineasta</option><option>Arte</option></select><button class="btn btn-gold" onclick="saveCreator()">Guardar</button><button class="btn" onclick="closeM('creator')">Cancelar</button></div></div>

<div class="toast" id="t"></div>

<script>
let D={logs:[],posts:[],creators:[]};
function load(){try{const d=localStorage.getItem('E');return d?JSON.parse(d):D}catch(e){return D}}
function save(){try{localStorage.setItem('E',JSON.stringify(D))}catch(e){}render()}
function toast(m){const t=document.getElementById('t');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1500)}
function openM(i){document.getElementById(i).classList.add('open')}
function closeM(i){document.getElementById(i).classList.remove('open')}
function tab(n){document.querySelectorAll('.tab').forEach(e=>e.classList.remove('active'));document.querySelectorAll('.nav-btn').forEach(e=>e.classList.remove('active'));document.getElementById('tab-'+n).classList.add('active');document.querySelectorAll('.nav-btn')[n].classList.add('active')}
function saveLog(){const date=document.getElementById('ld').value||new Date().toISOString().split('T')[0];D.logs.push({date,f:+document.getElementById('lf').value||0,v:+document.getElementById('lv').value||0,e:+document.getElementById('le').value||0});D.logs.sort((a,b)=>b.date.localeCompare(a.date));save();closeM('log');document.getElementById('ld').value='';document.getElementById('lf').value='';document.getElementById('lv').value='';document.getElementById('le').value='';toast('✓')}
function savePost(){D.posts.push({id:Date.now(),t:document.getElementById('pt').value,y:document.getElementById('pty').value,v:+document.getElementById('pv').value||0});save();closeM('post');document.getElementById('pt').value='';document.getElementById('pv').value='';toast('✓')}
function saveCreator(){const h=document.getElementById('ch').value;if(!h){toast('Pon @usuario');return}D.creators.push({id:Date.now(),h,n:document.getElementById('cn').value});save();closeM('creator');document.getElementById('ch').value='';toast('✓')}
function exp(){const blob=new Blob([JSON.stringify(D,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='eyehera.json';a.click()}
function imp(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{D=JSON.parse(r.result);save();toast('✓')}catch{toast('Error')}};r.readAsText(f)}
function seed(){if(confirm('¿Cargar datos iniciales?')){D.logs.push({date:new Date().toISOString().split('T')[0],f:22,v:9597,e:0});['@mattsoria','@brandon_breault','@soren_blakemiller','@lucidhoto','@brandonli_photography','@matthewlloydsmith','@javierflores.photo','@davidhunterphoto','@paulmsardelis','@oliverstrauss'].forEach(h=>{D.creators.push({id:Date.now()+Math.random(),h,n:'Fotógrafo'})});save();toast('✓')}}
function render(){const last=D.logs[0];document.getElementById('f').textContent=last?last.f:0;document.getElementById('v').textContent=last?last.v:0;document.getElementById('e').textContent=(last?last.e:0)+'%';document.getElementById('cc').textContent=D.creators.length;document.getElementById('logs').innerHTML=D.logs.length?D.logs.map(l=>`<div class="item"><div class="item-text"><div class="item-title">${l.date}</div><div class="item-sub">${l.f} seg · ${l.v} views</div></div><button class="btn-x" onclick="D.logs=D.logs.filter(x=>x.date!='${l.date}');save()">✕</button></div>`).join(''):'<div class="empty">Sin registros</div>';document.getElementById('posts').innerHTML=D.posts.length?D.posts.map(p=>`<div class="item"><div class="item-text"><div class="item-title">${p.t}</div><div class="item-sub">${p.y} · ${p.v} views</div></div><button class="btn-x" onclick="D.posts=D.posts.filter(x=>x.id!=${p.id});save()">✕</button></div>`).join(''):'<div class="empty">Sin posts</div>';document.getElementById('creators').innerHTML=D.creators.length?D.creators.map(c=>`<div class="item"><div class="item-text"><div class="item-title">${c.h}</div><div class="item-sub">${c.n}</div></div><button class="btn-x" onclick="D.creators=D.creators.filter(x=>x.id!=${c.id});save()">✕</button></div>`).join(''):'<div class="empty">Sin creadores</div>'}
D=load();document.getElementById('ld').value=new Date().toISOString().split('T')[0];render()
</script>
</body>
</html>
