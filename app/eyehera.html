<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EYEHERA</title><style>body{margin:0;padding:20px;background:#0a0a0a;color:#f2f2f2;font-family:system-ui;max-width:680px;margin:0 auto}h1{font-size:24px;margin-top:0}.card{background:#141414;border:1px solid #262626;padding:16px;border-radius:12px;margin:12px 0}.btn{width:100%;padding:14px;border:none;border-radius:10px;font-size:15px;cursor:pointer;margin:8px 0;font-weight:600}.gold{background:#c9a96a;color:#1a1408}.dark{background:#262626;color:#f2f2f2}.stat{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #262626}.stat:last-child{border:none}input,select{width:100%;padding:10px;margin:8px 0;background:#1c1c1c;border:1px solid #262626;color:#f2f2f2;border-radius:8px;font-family:inherit}label{display:block;font-size:12px;color:#8a8a8a;margin:12px 0 4px 0;font-weight:600}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:999;padding:20px}.modal.open{display:flex;flex-direction:column;justify-content:flex-end}.modal-content{background:#141414;border-radius:20px 20px 0 0;padding:20px;max-height:90vh;overflow-y:auto}nav{position:fixed;bottom:0;left:0;right:0;background:#0a0a0a;border-top:1px solid #262626;display:flex;padding:8px 0}.nav-btn{flex:1;padding:10px;background:none;border:none;color:#8a8a8a;cursor:pointer;font-size:12px}.nav-btn.active{color:#c9a96a}.tab{display:none}.tab.active{display:block}.title{font-size:12px;color:#8a8a8a;text-transform:uppercase;letter-spacing:0.1em;margin:20px 0 10px;font-weight:600}.list{list-style:none}.list li{padding:12px 0;border-bottom:1px solid #262626;display:flex;justify-content:space-between}.list li:last-child{border:none}.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#c9a96a;color:#1a1408;padding:10px 20px;border-radius:20px;font-size:14px;font-weight:600;opacity:0;transition:opacity 0.3s;pointer-events:none}.toast.show{opacity:1}</style></head><body><div style="padding-bottom:80px"><h1>👁 EYEHERA Control</h1><p style="color:#8a8a8a;margin:0">Dashboard Personal</p><div class="card"><div class="stat"><span>Seguidores</span><strong id="f">0</strong></div><div class="stat"><span>Vistas</span><strong id="v">0</strong></div><div class="stat"><span>Engagement</span><strong id="e">0%</strong></div></div><button class="btn gold" onclick="openM('log')">+ Registrar día</button> <button class="btn dark" onclick="openM('post')">+ Nuevo post</button> <button class="btn dark" onclick="openM('creator')">+ Creador</button><div id="t0" class="tab active"><div class="title">Últimos registros</div><ul class="list" id="logs"></ul></div><div id="t1" class="tab"><div class="title">Posts</div><ul class="list" id="posts"></ul></div><div id="t2" class="tab"><div class="title">Creadores</div><div>Total: <strong id="cc">0</strong>/100</div><ul class="list" id="creators"></ul></div><div id="t3" class="tab"><button class="btn dark" onclick="exp()">⬇ Exportar datos</button> <button class="btn dark" onclick="document.getElementById('imp').click()">⬆ Importar datos</button> <input type="file" id="imp" accept=".json" onchange="imp(event)" style="display:none"> <button class="btn gold" onclick="seed()">✦ Datos iniciales</button></div></div><nav><button class="nav-btn active" onclick="t(0)">Hoy</button><button class="nav-btn" onclick="t(1)">Posts</button><button class="nav-btn" onclick="t(2)">Creators</button><button class="nav-btn" onclick="t(3)">Datos</button></nav><div id="log" class="modal"><div class="modal-content"><h2>Registrar día</h2><label>Fecha</label><input type="date" id="ld"><label>Seguidores</label><input type="number" id="lf"><label>Vistas</label><input type="number" id="lv"><label>Engagement %</label><input type="number" step="0.1" id="le"><button class="btn gold" onclick="saveLog()">Guardar</button><button class="btn dark" onclick="closeM('log')">Cancelar</button></div></div><div id="post" class="modal"><div class="modal-content"><h2>Nuevo post</h2><label>Título</label><input id="pt"><label>Tipo</label><select id="pty"><option>Reel</option><option>Imagen</option><option>Carrusel</option></select><label>Vistas</label><input type="number" id="pv"><button class="btn gold" onclick="savePost()">Guardar</button><button class="btn dark" onclick="closeM('post')">Cancelar</button></div></div><div id="creator" class="modal"><div class="modal-content"><h2>Añadir creador</h2><label>@usuario</label><input id="ch" placeholder="@usuario"><label>Nicho</label><select id="cn"><option>Fotógrafo</option><option>Curador</option><option>Cineasta</option><option>Arte</option></select><button class="btn gold" onclick="saveCreator()">Guardar</button><button class="btn dark" onclick="closeM('creator')">Cancelar</button></div></div><div class="toast" id="toast"></div><script>let D={logs:[],posts:[],creators:[]};function load(){const x=localStorage.getItem('EYEHERA');return x?JSON.parse(x):D}function save(){localStorage.setItem('EYEHERA',JSON.stringify(D));render()}function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1500)}function openM(i){document.getElementById(i).classList.add('open')}function closeM(i){document.getElementById(i).classList.remove('open')}function t(i){document.querySelectorAll('.tab').forEach(e=>e.classList.remove('active'));document.querySelectorAll('.nav-btn').forEach(e=>e.classList.remove('active'));document.getElementById('t'+i).classList.add('active');document.querySelectorAll('.nav-btn')[i].classList.add('active')}function saveLog(){const date=document.getElementById('ld').value||new Date().toISOString().split('T')[0];D.logs.push({date,f:+document.getElementById('lf').value||0,v:+document.getElementById('lv').value||0,e:+document.getElementById('le').value||0});D.logs.sort((a,b)=>b.date.localeCompare(a.date));save();closeM('log');document.getElementById('ld').value='';document.getElementById('lf').value='';document.getElementById('lv').value='';document.getElementById('le').value='';toast('✓ Guardado')}function savePost(){D.posts.push({title:document.getElementById('pt').value,type:document.getElementById('pty').value,views:+document.getElementById('pv').value||0});save();closeM('post');document.getElementById('pt').value='';document.getElementById('pv').value='';toast('✓ Post guardado')}function saveCreator(){const h=document.getElementById('ch').value;if(!h){toast('Pon @usuario');return}D.creators.push({handle:h,niche:document.getElementById('cn').value});save();closeM('creator');document.getElementById('ch').value='';toast('✓ Creador guardado')}function exp(){const blob=new Blob([JSON.stringify(D,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='eyehera-backup.json';a.click();toast('✓ Descargado')}function imp(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{D=JSON.parse(r.result);save();toast('✓ Importado')}catch{toast('Error')}};r.readAsText(f)}function seed(){if(confirm('¿Cargar datos iniciales?')){D.logs.push({date:new Date().toISOString().split('T')[0],f:22,v:9597,e:0});['@mattsoria','@brandon_breault','@soren_blakemiller','@lucidhoto','@brandonli_photography'].forEach(h=>{D.creators.push({handle:h,niche:'Fotógrafo'})});save();toast('✓ Cargado')}}function render(){const last=D.logs[D.logs.length-1];document.getElementById('f').textContent=last?last.f:0;document.getElementById('v').textContent=last?last.v:0;document.getElementById('e').textContent=(last?last.e:0)+'%';document.getElementById('cc').textContent=D.creators.length;document.getElementById('logs').innerHTML=D.logs.length?D.logs.map(l=>`<li><div>${l.date} · ${l.f} seg</div><button class="dark" onclick="D.logs=D.logs.filter(x=>x.date!='${l.date}');save()" style="border:none;background:none;color:#e06a5c;cursor:pointer">✕</button></li>`).join(''):'<li style="border:none;color:#5a5a5a">Sin registros</li>';document.getElementById('posts').innerHTML=D.posts.length?D.posts.map(p=>`<li><div><strong>${p.title}</strong><br><small>${p.type}</small></div></li>`).join(''):'<li style="border:none;color:#5a5a5a">Sin posts</li>';document.getElementById('creators').innerHTML=D.creators.length?D.creators.map(c=>`<li>${c.handle}</li>`).join(''):'<li style="border:none;color:#5a5a5a">Sin creadores</li>'}D=load();document.getElementById('ld').value=new Date().toISOString().split('T')[0];render()</script></body></html>
